      if (!isVisible) return null;

      return (
        <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.1)] p-4 sm:p-5 z-50 flex flex-col sm:flex-row items-center justify-center sm:justify-between gap-4">
          <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between w-full gap-4">
            <p className="text-gray-700 text-sm sm:text-base text-center sm:text-left leading-relaxed">
              Utilizamos cookies para mejorar tu experiencia y gestionar los enlaces de afiliados. Al navegar, aceptas su uso.{' '}
              <button
                onClick={() => navigateTo('legal')}
                className="text-brand-600 font-bold underline hover:text-brand-800 transition-colors inline-block mt-1 sm:mt-0 cursor-pointer"
              >
                Aviso Legal y Privacidad
              </button>
            </p>
            <button
              onClick={handleAccept}
              className="shrink-0 bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 px-8 rounded-xl shadow-md transition-all focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 w-full sm:w-auto"
            >
              Aceptar
            </button>
          </div>
        </div>
      );
    };

    // --- APP ---
    function App() {
      const { useState, useEffect, useCallback, useMemo } = React;
      const [currentPage, setCurrentPage] = useState('main');
      const [activeSection, setActiveSection] = useState('home');

      const syncPageFromUrl = useCallback(() => {
        const params = new URLSearchParams(window.location.search);
        const pageParam = params.get('page');
        const sectionParam = params.get('section');
        let newPage = 'main';
        
        if (pageParam === 'cv') newPage = 'cv';
        else if (pageParam === 'analyzer') newPage = 'analyzer';
        else if (pageParam === 'legal') newPage = 'legal';

        setCurrentPage(newPage);
        
        if (sectionParam) {
          sessionStorage.setItem('pendingScroll', sectionParam);
        }
        
        document.title = "IAdapta | Terapia Ocupacional y Accesibilidad";
      }, []);

      useEffect(() => {
        syncPageFromUrl();
        window.addEventListener('popstate', syncPageFromUrl);
        return () => window.removeEventListener('popstate', syncPageFromUrl);
      }, [syncPageFromUrl]);

      useEffect(() => {
        if (currentPage === 'main') {
          const pending = sessionStorage.getItem('pendingScroll');
          if (pending) {
            sessionStorage.removeItem('pendingScroll');
            setTimeout(() => {
              const el = document.getElementById(pending);
              if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 300);
          }
        }
      }, [currentPage]);

      useEffect(() => {
        if (currentPage !== 'main') return;
        const sections = ['home', 'analyzer', 'guides', 'cognitive', 'resources', 'about', 'contact'];
        const onScroll = () => {
          const scrollY = window.scrollY + 120;
          let current = 'home';
          sections.forEach(id => {
            const el = document.getElementById(id);
            if (el && el.offsetTop <= scrollY) current = id;
          });
          setActiveSection(current);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, [currentPage]);

      const scrollTo = useCallback((id) => {
        setActiveSection(id);
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, []);

      const navigateTo = useCallback((page, section = null) => {
        const localPages = ['main', 'cv', 'analyzer', 'legal'];
        
        if (localPages.includes(page)) {
          const urlPage = page === 'main' ? 'home' : page;
          window.history.pushState({ page }, '', '?page=' + urlPage);
          setCurrentPage(page);
          if (section) {
            setTimeout(() => scrollTo(section), 100);
          } else {
            window.scrollTo({ top: 0, behavior: 'instant' });
          }
        } else {
          let target = 'index.html';
          if (page === 'cognitive' || page === 'games') target = 'estimulacion-cognitiva.html';
          else if (page === 'resources') target = 'recursos.html';
          else if (page === 'guides') target = 'guias.html';
          
          if (section) {
            target += '?section=' + section;
          }
          window.location.href = target;
        }
      }, [scrollTo]);

      return (
        <>
          <Navbar activeSection={activeSection} scrollTo={scrollTo} currentPage={currentPage} navigateTo={navigateTo} />
          <main id="main-content">
            {currentPage === 'main' && (
              <>
                <SectionHome scrollTo={scrollTo} navigateTo={navigateTo} />
                <div className="max-w-4xl mx-auto px-4"><div className="section-divider my-0"></div></div>
                <SectionAbout navigateTo={navigateTo} />
                <div className="max-w-4xl mx-auto px-4"><div className="section-divider my-0"></div></div>
                <SectionContact />
              </>
            )}
            {currentPage === 'cv' && (
              <SectionCV />
            )}
            {currentPage === 'analyzer' && (
              <SectionAnalyzer isTeaser={false} isStandalone={false} navigateTo={navigateTo} />
            )}
            {currentPage === 'legal' && (
              <SectionLegal />
            )}
          </main>
          <Footer scrollTo={scrollTo} navigateTo={navigateTo} />
          <CookieBanner navigateTo={navigateTo} />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
