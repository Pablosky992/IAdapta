        <div className="min-h-screen pt-28 pb-20 px-4 bg-gray-50">
          <div className="max-w-4xl mx-auto bg-white rounded-[3rem] border border-gray-100 shadow-2xl overflow-hidden">
            {/* Tab Selector */}
            <div className="flex border-b border-gray-100 bg-brand-50/30">
              <button 
                onClick={() => setActiveTab('legal')}
                className={`flex-1 py-6 font-bold text-lg transition-all ${activeTab === 'legal' ? 'bg-white text-brand-900 border-b-4 border-brand-900' : 'text-gray-400 hover:text-brand-600'}`}
              >
                Aviso Legal
              </button>
              <button 
                onClick={() => setActiveTab('privacy')}
                className={`flex-1 py-6 font-bold text-lg transition-all ${activeTab === 'privacy' ? 'bg-white text-brand-900 border-b-4 border-brand-900' : 'text-gray-400 hover:text-brand-600'}`}
              >
                Política de Privacidad
              </button>
            </div>

            <div className="p-8 sm:p-16 space-y-10 text-gray-700 leading-relaxed text-lg anim-fade-in">
              {activeTab === 'legal' ? (
                <>
                  <h1 className="font-display text-4xl font-bold text-brand-900 mb-8">Aviso Legal</h1>
                  <section>
                    <h2 className="text-2xl font-bold text-brand-800 mb-4">1. Datos del Responsable</h2>
                    <p>En cumplimiento del artículo 10 de la Ley 34/2002, de 11 de julio, de Servicios de la Sociedad de la Información y Comercio Electrónico (LSSI), se exponen los siguientes datos identificativos:</p>
                    <ul className="mt-4 space-y-2 list-disc pl-6">
                      <li><strong>Titular:</strong> Pablo Narciso Millán (IAdapta)</li>
                      <li><strong>Actividad:</strong> Terapeuta Ocupacional & Especialista en Accesibilidad</li>
                      <li><strong>Email:</strong> iadaptato@gmail.com</li>
                      <li><strong>Sitio Web:</strong> iadapta.es</li>
                    </ul>
                  </section>

                  <section>
                    <h2 className="text-2xl font-bold text-brand-800 mb-4">2. Finalidad del Sitio Web</h2>
                    <p>
                      IAdapta es una plataforma informativa dedicada a la difusión de conocimientos sobre adaptaciones de ortopedia, accesibilidad y recursos para profesionales de la salud. 
                      El sitio web incluye enlaces de afiliación de Amazon y espacios publicitarios para su sostenibilidad.
                    </p>
                  </section>

                  <section>
                    <h2 className="text-2xl font-bold text-brand-800 mb-4">3. Exclusión de Responsabilidad (Descargo Clínico)</h2>
                    <p className="bg-brand-50 p-6 rounded-2xl border-l-4 border-brand-500 italic">
                      Todo el contenido, guías, análisis de IA y recursos publicados en este sitio web tienen carácter estrictamente orientativo e informativo. 
                      En ningún caso esta información sustituye la valoración clínica, el diagnóstico o el tratamiento realizado por un profesional sanitario colegiado en persona. 
                      IAdapta no se hace responsable de las decisiones tomadas por el usuario basadas únicamente en la información aquí expuesta.
                    </p>
                  </section>

                  <section>
                    <h2 className="text-2xl font-bold text-brand-800 mb-4">4. Propiedad Intelectual</h2>
                    <p>Todo el contenido de este sitio web, incluyendo textos, gráficos, interfaces, juegos cognitivos y logotipos, es propiedad de IAdapta o de sus proveedores de contenido y está protegido por las leyes de propiedad intelectual internacionales.</p>
                  </section>

                  <section>
                    <h2 className="text-2xl font-bold text-brand-800 mb-4">5. Condiciones de Uso</h2>
                    <p>El usuario se compromete a hacer un uso adecuado de los contenidos y servicios de la web. Queda prohibida la reproducción total o parcial de los recursos profesionales y juegos con fines comerciales sin autorización expresa del titular.</p>
                  </section>
                </>
              ) : (
                <>
                  <h1 className="font-display text-4xl font-bold text-brand-900 mb-8">Política de Privacidad y Cookies</h1>
                  <section>
                    <h2 className="text-2xl font-bold text-brand-800 mb-4">1. Protección de Datos (RGPD)</h2>
                    <p>IAdapta garantiza la protección de los datos de carácter personal que el usuario proporcione a través de los formularios de contacto o correos electrónicos, tratando dicha información con la máxima confidencialidad y únicamente para responder a las solicitudes de servicio.</p>
                  </section>
                  <section>
                    <h2 className="text-2xl font-bold text-brand-800 mb-4">2. Uso de Cookies</h2>
                    <p>Utilizamos cookies propias y de terceros para mejorar la experiencia de usuario y gestionar los enlaces de afiliación de Amazon:</p>
                    <ul className="mt-4 space-y-2 list-disc pl-6">
                      <li><strong>Cookies de Afiliación:</strong> Al clicar en productos recomendados, Amazon instala una cookie (24h) para identificar el origen de la compra.</li>
                      <li><strong>Cookies Técnicas:</strong> Necesarias para recordar tus preferencias (como la aceptación de este aviso).</li>
                    </ul>
                  </section>
                  <section>
                    <h2 className="text-2xl font-bold text-brand-800 mb-4">3. Analizador IA (Gemini Vision)</h2>
                    <p>Cuando utilizas nuestro Analizador IA, las imágenes enviadas se procesan de forma efímera a través de la API de Google Gemini para generar el informe de accesibilidad. <strong>No almacenamos, compartimos ni utilizamos tus imágenes</strong> para ningún otro fin comercial o de entrenamiento de modelos.</p>
                  </section>
                </>
              )}
              <div className="pt-10 border-t border-gray-100 flex justify-between items-center text-sm text-gray-400">
                <p>Última actualización: Mayo 2026</p>
                <p>iadapta.es</p>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- FOOTER ---
    const Footer = function Footer({ scrollTo, navigateTo }) {
      const year = new Date().getFullYear();
      return (
        <footer className="bg-brand-900 text-white pt-16 pb-8 px-4">
          <div className="max-w-6xl mx-auto">
            <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-10 mb-12">
              <div className="lg:col-span-2">
                <div className="mb-6 inline-block bg-accent-cream rounded-xl p-3 shadow-md">
                  <img src="assets/iadapta_logo.png" alt="IAdapta" className="h-14 object-contain" />
                </div>
                <p className="text-brand-200 text-lg leading-relaxed max-w-sm">
                  Evaluación experta de tu entorno y asesoramiento en productos de apoyo. "Te guío en la adaptación de tu casa para que vuelvas a moverte con seguridad y total confianza."
                </p>
              </div>
              <nav>
                <h3 className="text-base font-bold uppercase tracking-widest text-brand-300 mb-4">Navegación</h3>
                <ul className="space-y-3">
                  {[
                    { id: 'home', label: 'Inicio', isPage: false },
                    { id: 'cv', label: 'Curriculum Vitae', isPage: true },
                    { id: 'analyzer', label: 'Analizador IA', isPage: true },
                    { id: 'guides', label: 'Guías', isPage: true },
                    { id: 'cognitive', label: 'Área Cognitiva', isPage: true },
                    { id: 'contact', label: 'Contacto', isPage: false },
                  ].map(l => (
                    <li key={l.id}>
                      <button onClick={() => l.isPage ? navigateTo(l.id) : (navigateTo('main'), setTimeout(() => scrollTo(l.id), 100))} className="text-brand-200 hover:text-white transition-colors text-lg">
                        {l.label}
                      </button>
                    </li>
                  ))}
                </ul>
              </nav>
              <div>
                <h3 className="text-base font-bold uppercase tracking-widest text-brand-300 mb-4">Enlaces</h3>
                <ul className="space-y-3">
                  <li><a href="https://www.linkedin.com/in/pablo-narciso-millan" target="_blank" rel="noopener noreferrer" className="text-brand-200 hover:text-white transition-colors text-lg">LinkedIn</a></li>
                  <li>
                    <a 
                      href="https://www.paypal.com/donate/?hosted_button_id=E8A34ZM4Q4YS8" 
                      target="_blank" 
                      rel="noopener noreferrer" 
                      className="text-brand-200 hover:text-white transition-colors text-lg flex items-center gap-2 group"
                    >
                      <Icons.Heart className="group-hover:fill-red-500 group-hover:text-red-500 transition-all duration-300" />
                      Apoyar el proyecto
                    </a>
                  </li>
                  <li>
                    <button onClick={() => navigateTo('legal')} className="text-brand-200 hover:text-white transition-colors text-lg">
                      Aviso Legal y Privacidad
                    </button>
                  </li>
                </ul>
              </div>
            </div>
            <div className="border-t border-brand-800 pt-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-brand-400 text-base">
              <p>© {year} IAdapta — Terapia Ocupacional & Accesibilidad.</p>
              <p className="flex items-center gap-2 group cursor-default">
                <Icons.Heart className="group-hover:fill-red-500 group-hover:text-red-500 transition-all duration-300" /> 
                Hecho con cuidado para mejorar la autonomía
              </p>
            </div>
          </div>
        </footer>
      );
    };

    // --- COOKIE BANNER ---
    const CookieBanner = function CookieBanner({ navigateTo }) {
      const [isVisible, setIsVisible] = React.useState(false);

      React.useEffect(() => {
        const consent = localStorage.getItem('cookieConsent');
        if (!consent) {
          setIsVisible(true);
        }
      }, []);

      const handleAccept = () => {
        localStorage.setItem('cookieConsent', 'true');
        setIsVisible(false);
      };

      if (!isVisible) return null;

      return (
        <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.1)] p-4 sm:p-5 z-50 flex flex-col sm:flex-row items-center justify-center sm:justify-between gap-4">
          <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between w-full gap-4">
            <p className="text-gray-700 text-sm sm:text-base text-center sm:text-left leading-relaxed">
              Utilizamos cookies para mejorar tu experiencia y gestionar los enlaces de afiliados. Al navegar, aceptas su uso.{' '}
              <button
                onClick={() => navigateTo('legal')}
                className="text-brand-600 font-bold underline hover:text-brand-800 transition-colors inline-block mt-1 sm:mt-0 cursor-pointer"
              >
                Aviso Legal y Privacidad
              </button>
            </p>
            <button
              onClick={handleAccept}
              className="shrink-0 bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 px-8 rounded-xl shadow-md transition-all focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 w-full sm:w-auto"
            >
              Aceptar
            </button>
          </div>
        </div>
      );
    };

    // --- APP ---
    function App() {
      const { useState, useEffect, useCallback, useMemo } = React;
      const [currentPage, setCurrentPage] = useState('main'); // 'main', 'cv', 'cookies', 'memory', 'order'
      const [activeSection, setActiveSection] = useState('home');
      const [isPWA, setIsPWA] = useState(false);
      const [installable, setInstallable] = useState(false);

      // Detect if running as PWA
      const checkPWA = useCallback(() => {
        setIsPWA(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone);
      }, []);

      // Handlers for installability
        const handleInstallable = () => setInstallable(true);
        const handleInstalled = () => { setInstallable(false); checkPWA(); };

        useEffect(() => {
          checkPWA();
          
          const handleAutoInstall = () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('autoInstall') === 'true' && window.deferredPrompt) {
              window.deferredPrompt.prompt();
              // Remove the flag so it doesn't prompt on every reload
              const url = new URL(window.location.href);
              url.searchParams.delete('autoInstall');
              window.history.replaceState({}, '', url.toString());
            }
          };

          window.addEventListener('pwa-installable', () => {
            handleInstallable();
            handleAutoInstall();
          });
          window.addEventListener('pwa-installed', handleInstalled);
          
          if (window.deferredPrompt) {
            setInstallable(true);
            handleAutoInstall();
          }

          return () => {
            window.removeEventListener('pwa-installable', handleInstallable);
            window.removeEventListener('pwa-installed', handleInstalled);
          };
        }, []);

      const syncPageFromUrl = useCallback(() => {
        const params = new URLSearchParams(window.location.search);
        const pageParam = params.get('page');
        
        if (!pageParam || pageParam === 'home') {
          setCurrentPage('main');
        } else if (pageParam === 'resources') {
          setCurrentPage('resources');
        } else if (pageParam === 'cognitive' || pageParam === 'games') {
          setCurrentPage('cognitive');
        } else if (pageParam === 'memory') {
          setCurrentPage('memory');
        } else if (pageParam === 'order') {
          setCurrentPage('order');
        } else if (pageParam === 'wordsearch') {
          setCurrentPage('wordsearch');
        } else if (pageParam === 'math') {
          setCurrentPage('math');
        } else if (pageParam === 'analyzer') {
          setCurrentPage('analyzer');
        } else if (pageParam === 'cv') {
          setCurrentPage('cv');
        } else if (pageParam === 'challenge') {
          setCurrentPage('challenge');
        } else if (pageParam === 'visual') {
          setCurrentPage('visual');
        }
      }, []);

      useEffect(() => {
        syncPageFromUrl();
        window.addEventListener('popstate', syncPageFromUrl);
        return () => window.removeEventListener('popstate', syncPageFromUrl);
      }, [syncPageFromUrl]);

      useEffect(() => {
        if (currentPage !== 'main') return;
        const sections = ['home', 'analyzer', 'guides', 'cognitive', 'resources', 'about', 'contact'];
        const onScroll = () => {
          const scrollY = window.scrollY + 120;
          let current = 'home';
          sections.forEach(id => {
            const el = document.getElementById(id);
            if (el && el.offsetTop <= scrollY) current = id;
          });
          setActiveSection(current);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, [currentPage]);

      const scrollTo = useCallback((id) => {
        setActiveSection(id);
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, []);

      const navigateTo = useCallback((page) => {
        const urlPage = page === 'main' ? 'home' : page;
        const currentUrlParam = new URLSearchParams(window.location.search).get('page') || 'home';

        // 1. PWA Context Swapping (Requires reload to change manifest in <head>)
        const isTargetContextChange = (page === 'main' || page === 'resources' || page === 'cognitive' || page === 'games');
        const isCurrentContextChange = (currentUrlParam === 'home' || currentUrlParam === 'resources' || currentUrlParam === 'cognitive' || currentUrlParam === 'games');
        
        if (isTargetContextChange && isCurrentContextChange && page !== (currentUrlParam === 'home' ? 'main' : currentUrlParam)) {
          const baseUrl = window.location.href.split('?')[0];
          window.location.href = `${baseUrl}?page=${urlPage}`;
          return;
        }

        // 2. Internal SPA Navigation (Use History API)
        if (currentUrlParam !== urlPage) {
          window.history.pushState({ page }, '', `?page=${urlPage}`);
        }
        setCurrentPage(page);
        window.scrollTo({ top: 0, behavior: 'instant' });
      }, []);

      const params = new URLSearchParams(window.location.search);
      const pageParam = params.get('page');
      const isStandalone = pageParam === 'memory' || pageParam === 'order' || pageParam === 'wordsearch' || pageParam === 'analyzer' || (pageParam === 'games' && (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone));

      return (
        <>
          {!isStandalone && <Navbar activeSection={activeSection} scrollTo={scrollTo} currentPage={currentPage} navigateTo={navigateTo} />}
          <main id="main-content">
            {currentPage === 'main' && (
              <>
                {!isStandalone && <SectionHome scrollTo={scrollTo} navigateTo={navigateTo} />}
                {!isStandalone && <div className="max-w-4xl mx-auto px-4"><div className="section-divider my-0"></div></div>}
                {!isStandalone && <SectionAbout navigateTo={navigateTo} />}
                {!isStandalone && <div className="max-w-4xl mx-auto px-4"><div className="section-divider my-0"></div></div>}
                {!isStandalone && <SectionContact />}
              </>
            )}
            {currentPage === 'cv' && (
              <SectionCV />
            )}
            {currentPage === 'cognitive' && (
              <SectionCognitive isTeaser={true} navigateTo={navigateTo} isStandalone={isStandalone} isPWA={isPWA} />
            )}
            {currentPage === 'guides' && (
              <SectionGuides />
            )}
            {currentPage === 'resources' && (
              <SectionResources navigateTo={navigateTo} isPWA={isPWA} />
            )}
            {currentPage === 'memory' && (
              <SectionCognitive isTeaser={false} navigateTo={navigateTo} isStandalone={isStandalone} />
            )}
            {currentPage === 'order' && (
              <SectionOrderGame isStandalone={isStandalone} navigateTo={navigateTo} />
            )}
            {currentPage === 'wordsearch' && (
              <SectionWordSearch isStandalone={isStandalone} navigateTo={navigateTo} />
            )}
            {currentPage === 'math' && (
              <SectionMathGame isStandalone={isStandalone} navigateTo={navigateTo} />
            )}
            {currentPage === 'visual' && (
              <SectionVisualGame isStandalone={isStandalone} navigateTo={navigateTo} />
            )}
            {currentPage === 'analyzer' && (
              <SectionAnalyzer isTeaser={false} isStandalone={isStandalone} navigateTo={navigateTo} />
            )}
            {currentPage === 'challenge' && (
              <SectionDailyChallenge isStandalone={isStandalone} navigateTo={navigateTo} />
            )}
            {currentPage === 'legal' && (
              <SectionLegal />
            )}
          </main>
          {!isStandalone && <Footer scrollTo={scrollTo} navigateTo={navigateTo} />}
          {!isStandalone && <CookieBanner navigateTo={navigateTo} />}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);


  </script>
</body>

</html>
