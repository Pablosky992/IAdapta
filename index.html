// --- NAVBAR ---
window.Navbar = function Navbar({ activeSection, scrollTo, currentPage, navigateTo }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 30);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const linksMain = [
    { id: 'home', label: 'Inicio' },
    { id: 'about', label: 'Sobre Mí' },
    { id: 'analyzer', label: 'Analizador IA' },
    { id: 'guides', label: 'Guías' },
    { id: 'contact', label: 'Contacto' },
  ];

  const handle = (id) => {
    if (currentPage !== 'main') {
      navigateTo('main');
      setTimeout(() => scrollTo(id), 100);
    } else {
      scrollTo(id);
    }
    setMenuOpen(false);
  };

  return (
    <header role="banner">
      <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${scrolled ? 'nav-blur' : 'bg-white/75'}`}>
        <div className="max-w-6xl mx-auto px-4 sm:px-6">
          <div className="flex items-center justify-between h-20">
            <button onClick={() => handle('home')} className="flex items-center rounded-xl p-1 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500">
              <img src="assets/iadapta_logo.png" alt="IAdapta" className="h-14 object-contain" />
            </button>

            <ul className="hidden md:flex items-center gap-1 list-none m-0 p-0">
              {linksMain.map(link => (
                <li key={link.id}>
                  <button onClick={() => handle(link.id)} className={`px-4 py-2.5 rounded-xl text-base font-semibold transition-all duration-200 ${
                    currentPage === 'main' && activeSection === link.id ? 'bg-brand-100 text-brand-700' : 'text-gray-600 hover:text-brand-700 hover:bg-brand-50'
                  }`}>
                    {link.label}
                  </button>
                </li>
              ))}
              <li>
                <button onClick={() => navigateTo('cv')} className={`px-4 py-2.5 rounded-xl text-base font-semibold transition-all duration-200 ${
                  currentPage === 'cv' ? 'bg-brand-600 text-white shadow-md' : 'text-brand-600 hover:bg-brand-50 border border-brand-200 ml-2'
                }`}>
                  CV Interactivo
                </button>
              </li>
            </ul>

            <button className="md:hidden p-2 rounded-xl text-gray-600" onClick={() => setMenuOpen(o => !o)}>
              {menuOpen ? <Icons.Close /> : <Icons.Menu />}
            </button>
          </div>
        </div>

        {menuOpen && (
          <div className="md:hidden bg-white border-t border-brand-100 px-4 py-3 space-y-1 shadow-xl">
            {linksMain.map(link => (
              <button key={link.id} onClick={() => handle(link.id)} className="w-full text-left px-4 py-3.5 rounded-xl text-lg font-semibold text-gray-700 hover:bg-brand-50">
                {link.label}
              </button>
            ))}
            <button onClick={() => { navigateTo('cv'); setMenuOpen(false); }} className="w-full text-left px-4 py-3.5 rounded-xl text-lg font-semibold text-brand-600 bg-brand-50">
              CV Interactivo
            </button>
          </div>
        )}
      </nav>
    </header>
  );
};

          {/* Formación y Skills */}
          <div className="space-y-10">

              <h3 className="font-display text-2xl font-bold text-brand-900 mb-6 flex items-center gap-3">
                <span className="w-8 h-8 bg-sky-500 rounded-lg flex items-center justify-center text-white text-sm font-bold">H</span>

              <ul className="space-y-4">
                {skills.map((s) => (
                  <li key={s.label}>

            <div>
              <h3 className="font-display text-2xl font-bold text-brand-900 mb-6 flex items-center gap-3">
                <span className="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center text-white text-sm font-bold">F</span>

                {education.map((e, i) => (

                    <div className="shrink-0 w-14 h-14 bg-brand-50 rounded-xl flex items-center justify-center border border-brand-100">

            <div>
              <h3 className="font-display text-2xl font-bold text-brand-900 mb-6 flex items-center gap-3">

                Herramientas e Idiomas
              </h3>
              <div className="bg-white p-5 rounded-2xl border border-brand-100 shadow-sm">
                <p className="text-gray-700 mb-2"><strong>Idiomas:</strong> Catalán (Nativo), Castellano (Nativo), Inglés (Nivel medio)</p>
                <p className="text-gray-700 mb-2"><strong>Software:</strong> ResiPlus, Ortogest, Office avanzado</p>

};

// --- SECTION ANALYZER ---
window.SectionAnalyzer = function SectionAnalyzer() {
  const { useState, useRef } = React;
  const [step, setStep] = useState('form');
  const [score, setScore] = useState(0);
  const [ringOffset, setRingOffset] = useState(283);
  const [form, setForm] = useState({ tipo:'', planta:'', banyo:'', iluminacion:'', puertas:'', movilidad:'', nivelMovilidad:'', capacidadesMotoras:'', notas:'' });
  
  // New States for AI Image Analysis
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [base64, setBase64] = useState(null);
  const [aiResponse, setAiResponse] = useState('');
  const [isDragging, setIsDragging] = useState(false);
  const [aiError, setAiError] = useState('');

  const resultRef = useRef(null);

  const handleChange = (e) => setForm(f => ({ ...f, [e.target.name]: e.target.value }));

  const handleDragOver = (e) => { e.preventDefault(); setIsDragging(true); };
  const handleDragLeave = (e) => { e.preventDefault(); setIsDragging(false); };
  const handleDrop = (e) => {
    e.preventDefault(); setIsDragging(false);
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      handleFile(e.dataTransfer.files[0]);
    }
  };
  const handleFileSelect = (e) => {
    if (e.target.files && e.target.files[0]) {
      handleFile(e.target.files[0]);
    }
  };

  const handleFile = (selectedFile) => {
    setFile(selectedFile);
    setPreview(URL.createObjectURL(selectedFile));
    const reader = new FileReader();
    reader.onloadend = () => {
      const base64String = reader.result.replace('data:', '').replace(/^.+,/, '');
      setBase64(base64String);
    };
    reader.readAsDataURL(selectedFile);
  };

  const removeFile = () => {
    setFile(null); setPreview(null); setBase64(null);
  };

  const calcScore = () => {
    let pts = 20; 
    if (form.banyo === 'adaptado') pts += 35; else if (form.banyo === 'barras') pts += 20;
    if (form.iluminacion === 'buena') pts += 20; else if (form.iluminacion === 'media') pts += 10;
    if (form.puertas === 'anchas') pts += 15; else if (form.puertas === 'normal') pts += 7;
    if (form.movilidad === 'ninguna') pts += 10;
    
    if (form.nivelMovilidad === 'asistencia' || form.nivelMovilidad === 'encamado') pts -= 15;
    if (form.capacidadesMotoras === 'inestabilidad') pts -= 10;
    
    return Math.max(0, Math.min(pts, 100));
  };

  const getRecommendations = (sc) => {
    const all = [];

    if (form.banyo === 'banyera' || form.banyo === 'nada' || form.banyo === 'barras') {
      all.push({ 
        cond: true, icon: '🚿', prio: 'Alta', 
        text: 'Para prevenir caídas durante la higiene diaria, la intervención prioritaria es evitar superar el bordillo de la bañera en bipedestación. Retire cualquier alfombra de tela suelta y seque bien el suelo tras su uso. Como solución principal y más segura (antes de pensar en reformas), utilice un asiento giratorio. Este dispositivo le permitirá sentarse desde fuera e introducir las piernas de forma suave y controlada. Acompáñelo de asideros de pared fijados a 75-80cm de altura para tener un apoyo firme al levantarse.',
        linkText: 'Ver asiento giratorio', linkUrl: 'https://amzn.to/4d3bjlv'
      });
      all.push({ 
        cond: true, icon: '🚽', prio: 'Alta', 
        text: 'La transferencia al inodoro supone un gran esfuerzo articular y un riesgo de desequilibrio si hay debilidad en las piernas. Mantenga el papel higiénico a una altura accesible sin necesidad de girar el tronco. Para facilitar el sentarse y levantarse de forma autónoma, añada un elevador de inodoro con reposabrazos. Esto reduce drásticamente la flexión de cadera y rodilla requerida, protegiendo sus articulaciones.',
        linkText: 'Ver elevador de inodoro', linkUrl: 'https://amzn.to/42hlsWU'
      });
    }

    if (form.iluminacion !== 'buena' && form.iluminacion !== '') {
      all.push({ 
        cond: true, icon: '💡', prio: 'Media', 
        text: 'Una correcta agudeza visual es el primer mecanismo para evitar tropiezos. Mantenga libres las ventanas durante el día y evite productos de limpieza que dejen el suelo excesivamente reflectante, ya que los destellos pueden causar desorientación. Además, modifique el entorno nocturno de forma sencilla: instale luces automáticas con sensor de movimiento cerca del rodapié en los trayectos al baño y marque posibles desniveles con cinta adhesiva de alto contraste.'
      });
    }

    if (form.puertas === 'estrechas' || form.puertas === 'normal') {
      all.push({ 
        cond: true, icon: '🛏️', prio: 'Media', 
        text: 'Las transferencias desde la cama requieren vencer la gravedad, siendo extenuantes si el colchón está muy bajo. Primero, despeje el dormitorio reorganizando mesas o sillas para garantizar pasillos interiores de al menos 80cm, permitiendo giros seguros. En segundo lugar, en vez de comprar una cama nueva, eleve los puntos de apoyo de su estructura actual utilizando tacos elevadores en las patas; notará un gran alivio al levantarse por las mañanas.',
        linkText: 'Ver tacos elevadores de cama', linkUrl: 'https://amzn.to/4tXN3Zo'
      });
    }

    if (form.movilidad === 'baston' || form.movilidad === 'andador') {
      all.push({ 
        cond: true, icon: '🦯', prio: 'Alta', 
        text: 'El uso de ayudas técnicas exige un entorno libre de obstáculos. Es vital que retire inmediatamente TODAS las alfombras decorativas y recoja cualquier cable suelto en zonas de paso. La seguridad de su marcha depende de la adherencia al suelo; revise periódicamente el desgaste de la goma inferior de su dispositivo y cámbielas siempre por conteras antideslizantes de base ancha, que aportan muchísima más estabilidad.',
        linkText: 'Ver conteras antideslizantes', linkUrl: 'https://amzn.to/4uw9fth'
      });
    } else if (form.movilidad === 'silla' || form.movilidad === 'ninguna') {
      all.push({ 
        cond: true, icon: '🍳', prio: 'Media', 
        text: 'La fatiga articular en la cocina limita gravemente la autonomía. Cocine en posición sentada siempre que sea posible y acerque los electrodomésticos pesados al borde de la encimera. Para compensar la pérdida de fuerza y proteger sus articulaciones, sustituya sus utensilios estándar por un set de cubiertos con mangos engrosados ergonómicos, reduciendo el dolor al comer o preparar alimentos.',
        linkText: 'Ver set de cubiertos adaptados', linkUrl: 'https://amzn.to/4wi1BVq'
      });
    }

    if (form.nivelMovilidad === 'encamado' || form.nivelMovilidad === 'asistencia') {
      all.push({
        cond: true, icon: '🛏️', prio: 'Alta',
        text: 'Ante un grado de dependencia alto, el objetivo es doble: fomentar los movimientos propios del usuario y proteger la espalda del cuidador. Le sugerimos coordinar los cambios posturales con la respiración. Para potenciar la autonomía en giros e incorporaciones, instale un trapecio universal en el cabecero. Esto permite usar la fuerza de los brazos para acomodarse, reduciendo drásticamente la carga de peso asistida.',
        linkText: 'Ver trapecio universal', linkUrl: 'https://amzn.to/3PqiHj4'
      });
    }

    if (form.capacidadesMotoras === 'debilidad' || form.capacidadesMotoras === 'inestabilidad') {
      all.push({
        cond: true, icon: '🍽️', prio: 'Media',
        text: 'Cocinar con inestabilidad o debilidad incrementa el riesgo de accidentes, cortes y quemaduras. Acostúmbrese a deslizar las ollas pesadas en lugar de levantarlas a pulso. Para garantizar una manipulación segura, incorpore una tabla de cortar adaptada. Sus ventosas y clavos de fijación le permitirán pelar y cortar alimentos usando una sola mano sin que la tabla se resbale por la encimera.',
        linkText: 'Ver tabla de cortar adaptada', linkUrl: 'https://amzn.to/42CtdHf'
      });
    }

    if (sc < 80) {
      all.push({ 
        cond: true, icon: '📋', prio: 'Info', 
        text: 'Reforma Estructural (Última línea de intervención): Si tras retirar obstáculos, instalar los productos de apoyo recomendados y adaptar sus rutinas, la seguridad sigue comprometida de forma severa, valore ejecutar obras estructurales. Las intervenciones con mayor impacto suelen ser la sustitución de la bañera por un plato de ducha continuo (enrasado) y la ampliación de marcos de puertas a 80 cm.' 
      });
    }

    return all;
  };

  const prioBadge = { Alta: 'bg-red-100 text-red-700', Media: 'bg-amber-100 text-amber-700', Info: 'bg-brand-100 text-brand-700' };

  const handleAnalyze = async (e) => {
    e.preventDefault();
    setStep('loading');
    setAiError('');
    setAiResponse('');

    if (file) {
      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            base64: base64,
            mimeType: file.type
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error);
        
        if (data.text) {
          setAiResponse(data.text);
        } else {
          throw new Error('No se pudo generar una respuesta.');
        }
      } catch (err) {
        console.error(err);
        setAiError(err.message || 'Error al procesar la imagen con la IA.');
      }
    }

    const sc = calcScore();
    setScore(sc);
    setStep('results');
    setTimeout(() => setRingOffset(283 - (283 * sc / 100)), 100);
    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
  };

  const reset = () => { 
    setStep('form'); setScore(0); setRingOffset(283); 
    setForm({ tipo:'', planta:'', banyo:'', iluminacion:'', puertas:'', movilidad:'', nivelMovilidad:'', capacidadesMotoras:'', notas:'' }); 
    setFile(null); setPreview(null); setBase64(null); setAiResponse(''); setAiError('');
  };

  const scoreColor = score >= 75 ? '#22c55e' : score >= 45 ? '#f59e0b' : '#ef4444';
  const scoreLabel = score >= 75 ? 'Buena accesibilidad' : score >= 45 ? 'Accesibilidad mejorable' : 'Accesibilidad limitada';

  const fieldClass = "w-full border-2 border-brand-200 rounded-xl px-4 py-3 text-lg text-gray-800 bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200 transition-all appearance-none";
  const labelClass = "block text-base font-bold text-brand-800 mb-2";

  return (
    <section id="analyzer" className="py-24 px-4 bg-gradient-to-b from-sky-50 to-white">
      <div className="max-w-4xl mx-auto">
        <div className="text-center mb-14">
          <span className="inline-block bg-sky-100 text-sky-700 rounded-full px-5 py-2 text-base font-bold uppercase tracking-widest mb-4">Inteligencia Artificial</span>
          <h2 className="font-display text-4xl sm:text-5xl font-bold text-brand-900 mb-4">Analizador de Accesibilidad</h2>
          <div className="section-divider w-24 mx-auto mb-6"></div>
          <p className="text-xl text-gray-600 max-w-2xl mx-auto">
            Sube una foto de una estancia (baño, cocina...) y nuestra conexión con Gemini Vision identificará las barreras arquitectónicas. También puedes responder al cuestionario manual para un análisis general.
          </p>
        </div>

        {step === 'form' && (
          <form onSubmit={handleAnalyze} className="bg-white rounded-3xl border border-brand-100 shadow-xl p-8 md:p-10 anim-scale-in" noValidate>
            
            {/* DRAG AND DROP ZONE */}
            <div className="mb-10">
              <h3 className="text-xl font-bold text-brand-900 mb-4 flex items-center gap-2">
                <Icons.Brain /> Análisis Visual (API Gemini)
              </h3>
              
              {!file ? (
                <div 
                  className={`border-3 border-dashed rounded-2xl p-10 text-center transition-all ${isDragging ? 'border-brand-500 bg-brand-50' : 'border-gray-300 hover:border-brand-400 bg-gray-50'}`}
                  onDragOver={handleDragOver}
                  onDragLeave={handleDragLeave}
                  onDrop={handleDrop}
                >
                  <svg className="w-12 h-12 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                  <p className="text-lg font-semibold text-gray-700 mb-2">Arrastra aquí una foto de tu baño o estancia</p>
                  <p className="text-sm text-gray-500 mb-4">o pulsa para seleccionarla desde tu dispositivo</p>
                  <input type="file" accept="image/*" onChange={handleFileSelect} className="hidden" id="file-upload" />
                  <label htmlFor="file-upload" className="inline-block px-6 py-2 bg-white border-2 border-brand-200 text-brand-700 font-bold rounded-xl cursor-pointer hover:bg-brand-50 transition-colors">Seleccionar Archivo</label>
                </div>
              ) : (
                <div className="relative border border-brand-200 rounded-2xl p-4 bg-brand-50 flex flex-col items-center">
                  <img src={preview} alt="Vista previa" className="max-h-64 rounded-xl shadow-md mb-4 object-contain" />
                  <p className="font-semibold text-brand-800">{file.name}</p>
                  <button type="button" onClick={removeFile} className="mt-2 text-red-600 hover:text-red-800 text-sm font-bold underline">Quitar imagen</button>
                </div>
              )}
            </div>

            <hr className="my-10 border-brand-100" />

            <h3 className="text-xl font-bold text-brand-900 mb-6 flex items-center gap-2">
              <Icons.Check /> Cuestionario Manual
            </h3>

            <div className="grid sm:grid-cols-2 gap-6">
              <div>
                <label className={labelClass}>Tipo de vivienda</label>
                <select name="tipo" value={form.tipo} onChange={handleChange} className={fieldClass} required>
                  <option value="">— Selecciona —</option>
                  <option value="piso">Piso / Apartamento</option>
                  <option value="casa">Casa unifamiliar</option>
                  <option value="adosado">Adosado / Chalet</option>
                  <option value="otro">Otro</option>
                </select>
              </div>
              <div>
                <label className={labelClass}>Planta en que vives</label>
                <select name="planta" value={form.planta} onChange={handleChange} className={fieldClass}>
                  <option value="">— Selecciona —</option>
                  <option value="baja">Planta baja</option>
                  <option value="con-ascensor">Con ascensor</option>
                  <option value="sin-ascensor">Sin ascensor</option>
                </select>
              </div>
              <div>
                <label className={labelClass}>Estado del cuarto de baño</label>
                <select name="banyo" value={form.banyo} onChange={handleChange} className={fieldClass} required>
                  <option value="">— Selecciona —</option>
                  <option value="adaptado">Completamente adaptado</option>
                  <option value="barras">Con barras de apoyo</option>
                  <option value="banyera">Solo bañera estándar</option>
                  <option value="nada">Sin ninguna adaptación</option>
                </select>
              </div>
              <div>
                <label className={labelClass}>Iluminación general</label>
                <select name="iluminacion" value={form.iluminacion} onChange={handleChange} className={fieldClass}>
                  <option value="">— Selecciona —</option>
                  <option value="buena">Buena (luz natural + artificial)</option>
                  <option value="media">Media (algunas zonas oscuras)</option>
                  <option value="mala">Insuficiente / deficiente</option>
                </select>
              </div>
              <div>
                <label className={labelClass}>Ancho de las puertas</label>
                <select name="puertas" value={form.puertas} onChange={handleChange} className={fieldClass}>
                  <option value="">— Selecciona —</option>
                  <option value="anchas">≥ 80 cm (accesibles)</option>
                  <option value="normal">70–79 cm (estándar)</option>
                  <option value="estrechas">{'< 70 cm (estrechas)'}</option>
                </select>
              </div>
              <div>
                <label className={labelClass}>Ayuda técnica que usas</label>
                <select name="movilidad" value={form.movilidad} onChange={handleChange} className={fieldClass}>
                  <option value="">— Selecciona —</option>
                  <option value="ninguna">Ninguna</option>
                  <option value="baston">Bastón</option>
                  <option value="andador">Andador</option>
                  <option value="silla">Silla de ruedas</option>
                </select>
              </div>
              <div>
                <label className={labelClass}>Nivel de movilidad</label>
                <select name="nivelMovilidad" value={form.nivelMovilidad} onChange={handleChange} className={fieldClass}>
                  <option value="">— Selecciona —</option>
                  <option value="independiente">Independiente total</option>
                  <option value="supervision">Requiere supervisión</option>
                  <option value="asistencia">Requiere asistencia física</option>
                  <option value="encamado">Encamado / Gran dependencia</option>
                </select>
              </div>
              <div>
                <label className={labelClass}>Capacidades motoras</label>
                <select name="capacidadesMotoras" value={form.capacidadesMotoras} onChange={handleChange} className={fieldClass}>
                  <option value="">— Selecciona —</option>
                  <option value="conservadas">Fuerza y equilibrio normales</option>
                  <option value="debilidad">Pérdida de fuerza o artritis</option>
                  <option value="inestabilidad">Problemas de equilibrio frecuentes</option>
                </select>
              </div>
            </div>

window.SectionContact = function SectionContact() {

  const [form, setForm] = useState({ nombre: '', email: '', telefono: '', motivo: '', mensaje: '' });
  const [sent, setSent] = useState(false);
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const handle = (e) => setForm(f => ({ ...f, [e.target.name]: e.target.value }));

  const validate = () => {
    if (!form.nombre.trim()) return 'Por favor, indica tu nombre.';
    if (!form.email.trim() || !/\S+@\S+\.\S+/.test(form.email)) return 'Introduce un correo electrónico válido.';
    if (!form.mensaje.trim()) return 'El mensaje no puede estar vacío.';
    return '';
  };

  const submit = (e) => {
    e.preventDefault();
    const err = validate();
    if (err) { setError(err); return; }
    setError('');
    setLoading(true);
    setTimeout(() => { setLoading(false); setSent(true); }, 1800);
  };

  const labelClass = "block text-base font-bold text-brand-800 mb-2";
  const inputClass = "w-full border-2 border-brand-200 rounded-xl px-4 py-3.5 text-lg text-gray-800 bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200 transition-all";

  const info = [
    { icon: <Icons.Mail />, label: 'Correo electrónico', value: 'iadaptato@gmail.com', href: 'mailto:iadaptato@gmail.com' },
    { icon: <Icons.Location />, label: 'Localización', value: 'Barcelona, España', href: null },
  ];

  return (
    <section id="contact" className="py-24 px-4 bg-gradient-to-b from-brand-50 to-white">

        <div className="text-center mb-14">

};

// --- APP ---
function App() {
  const [currentPage, setCurrentPage] = useState('main'); // 'main' or 'cv'
  const [activeSection, setActiveSection] = useState('home');

  useEffect(() => {
    if (currentPage !== 'main') return;
    const sections = ['home', 'about', 'analyzer', 'guides', 'contact'];
    const onScroll = () => {
      const scrollY = window.scrollY + 120;
      let current = 'home';
      sections.forEach(id => {
        const el = document.getElementById(id);
        if (el && el.offsetTop <= scrollY) current = id;
      });
      setActiveSection(current);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [currentPage]);

  const scrollTo = useCallback((id) => {
    setActiveSection(id);
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, []);

  const navigateTo = useCallback((page) => {
    setCurrentPage(page);
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, []);

  return (
    <>
      <Navbar activeSection={activeSection} scrollTo={scrollTo} currentPage={currentPage} navigateTo={navigateTo} />
      <main id="main-content">
        {currentPage === 'main' && (
          <>
            <SectionHome scrollTo={scrollTo} navigateTo={navigateTo} />
            <div className="max-w-4xl mx-auto px-4"><div className="section-divider my-0"></div></div>
            <SectionAnalyzer />
            <div className="max-w-4xl mx-auto px-4"><div className="section-divider my-0"></div></div>
            <SectionGuides />
            <div className="max-w-4xl mx-auto px-4"><div className="section-divider my-0"></div></div>
            <SectionContact />
          </>
        )}
        {currentPage === 'cv' && (
          <SectionCV />
        )}
      </main>
      <Footer scrollTo={scrollTo} navigateTo={navigateTo} />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);


  </script>
</body>
</html>
