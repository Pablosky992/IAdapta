    // --- SECTION COGNITIVE (GIMNASIO CEREBRAL) ---
    window.SectionCognitive = function SectionCognitive({ isTeaser, navigateTo, isStandalone }) {
      const { useState, useEffect, useCallback, useMemo } = React;

      // Card sequence for levels (pairs)
      const levelSequence = useMemo(() => [2, 4, 6, 8, 12.5], []); // Pairs count (12.5 means 25 cards total, last one can be a special)
      const [level, setLevel] = useState(0);
      const [cards, setCards] = useState([]);
      const [flipped, setFlipped] = useState([]);
      const [matched, setMatched] = useState([]);
      const [gameFinished, setGameFinished] = useState(false);

      const icons = ['🧠', '💡', '🌟', '🧩', '🚀', '🌈', '💎', '🎨', '🍎', '⚽', '🎸', '🍦', '🏠'];

      const initGame = useCallback((levelIdx) => {
        const pairsCount = Math.floor(levelSequence[levelIdx]);
        let gameIcons = icons.slice(0, pairsCount);
        let gameCards = [...gameIcons, ...gameIcons].map((icon, index) => ({
          id: index,
          icon,
          name: icon
        }));

        // Shuffle
        gameCards.sort(() => Math.random() - 0.5);

        setCards(gameCards);
        setFlipped([]);
        setMatched([]);
        setGameFinished(false);
        setLevel(levelIdx);
      }, [levelSequence]);

      useEffect(() => {
        if (!isTeaser) initGame(0);
      }, [isTeaser, initGame]);

      const handleFlip = (index) => {
        if (flipped.length === 2 || matched.includes(cards[index].name) || flipped.includes(index)) return;

        const newFlipped = [...flipped, index];
        setFlipped(newFlipped);

        if (newFlipped.length === 2) {
          const [first, second] = newFlipped;
          if (cards[first].name === cards[second].name) {
            setMatched([...matched, cards[first].name]);
            setFlipped([]);
            if (matched.length + 1 === Math.floor(levelSequence[level])) {
              setTimeout(() => setGameFinished(true), 600);
            }
          } else {
            setTimeout(() => setFlipped([]), 1000);

                  {/* Game 2 Teaser */}
                  <div className="bg-gradient-to-br from-sky-50 to-white rounded-3xl p-8 border border-sky-100 shadow-lg hover:shadow-xl transition-all group">

    const ORDER_LEVELS = [

    // --- SECTION ORDER GAME ---
    window.SectionOrderGame = function SectionOrderGame({ isStandalone }) {
      const [levelIndex, setLevelIndex] = React.useState(0);
      const [numbers, setNumbers] = React.useState([]);
      const [nextNumber, setNextNumber] = React.useState(1);
      const [status, setStatus] = React.useState('playing'); // playing, won
      const [startTime, setStartTime] = React.useState(Date.now());
      const [finalTime, setFinalTime] = React.useState(0);

      const currentLevel = ORDER_LEVELS[levelIndex];

      const initLevel = React.useCallback(() => {
        const nums = Array.from({ length: currentLevel.count }, (_, i) => i + 1);
        for (let i = nums.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [nums[i], nums[j]] = [nums[j], nums[i]];
        }
        setNumbers(nums);
        setNextNumber(1);
        setStatus('playing');
        setStartTime(Date.now());
      }, [currentLevel.count]); // Only depend on count, not the whole object

      React.useEffect(() => {
        initLevel();
      }, [initLevel]);

      const handleNumberClick = (num) => {
        if (status !== 'playing') return;
        if (num === nextNumber) {
          if (num === currentLevel.count) {
            setStatus('won');
            setFinalTime(((Date.now() - startTime) / 1000).toFixed(2));
          } else {
            setNextNumber(num + 1);
          }
        }
      };

      const nextLevel = () => {
        if (levelIndex < ORDER_LEVELS.length - 1) {
          setLevelIndex(levelIndex + 1);
        } else {
          setLevelIndex(0); // Reset
        }
      };

      return (
        <section className={`py-20 px-4 min-h-screen bg-brand-50 flex flex-col items-center ${isStandalone ? 'pt-32' : ''}`}>
          <div className="max-w-4xl w-full text-center">

              <button onClick={() => window.close()} className="mb-8 inline-flex items-center gap-2 text-brand-600 font-bold hover:text-brand-800 transition-colors">

                Cerrar juego
              </button>
            )}
            <h2 className="font-display text-4xl font-bold text-brand-900 mb-2">En Orden</h2>
            <p className="text-brand-600 font-bold mb-8 uppercase tracking-widest">Nivel {currentLevel.id}: Encuentra del 1 al {currentLevel.count}</p>

            {status === 'won' ? (
              <div className="bg-white rounded-3xl p-10 shadow-xl anim-scale-in border-2 border-emerald-200">
                <div className="text-6xl mb-6">🏆</div>
                <h3 className="text-3xl font-bold text-brand-900 mb-2">¡Nivel Completado!</h3>
                <p className="text-xl text-gray-600 mb-8">Tiempo: <span className="font-bold text-emerald-600">{finalTime}s</span></p>
                <div className="flex flex-col sm:flex-row gap-4 justify-center">
                  <button onClick={initLevel} className="px-8 py-3 bg-brand-100 text-brand-700 font-bold rounded-xl hover:bg-brand-200 transition-all">Repetir Nivel</button>
                  <button onClick={nextLevel} className="px-8 py-3 bg-brand-600 text-white font-bold rounded-xl hover:bg-brand-700 shadow-lg transition-all btn-pulse">
                    {levelIndex < ORDER_LEVELS.length - 1 ? 'Siguiente Nivel' : 'Volver al Inicio'}
                  </button>
                </div>
              </div>
            ) : (
              <div className={`grid ${currentLevel.cols} gap-3 sm:gap-4 max-w-2xl mx-auto`}>
                {numbers.map((num) => {
                  const isPast = num < nextNumber;
                  const isCurrent = num === nextNumber;
                  return (
                    <button
                      key={num}
                      onClick={() => handleNumberClick(num)}
                      className={`aspect-square flex items-center justify-center text-xl sm:text-2xl font-bold rounded-2xl transition-all shadow-sm
                        ${isPast ? 'bg-emerald-500 text-white shadow-inner opacity-50 scale-95 pointer-events-none' : 
                          isCurrent ? 'bg-white border-4 border-brand-400 text-brand-900 shadow-lg target-number' : 
                          'bg-white text-brand-700 hover:border-brand-200 hover:shadow-md border-2 border-brand-50 active:scale-95 active:bg-red-50'}`}
                    >
                      {num}
                    </button>
                  );
                })}
              </div>
            )}
          </div>
        </section>
      );
    };

    // --- NAVBAR ---
    window.Navbar = function Navbar({ activeSection, scrollTo, currentPage, navigateTo }) {

                  CV Interactivo

        { period: '2011 – 2014', role: 'Prácticas de Terapia Ocupacional', place: 'Varios Centros (Barcelona y L\'H)', desc: 'Formación práctica en salud mental, entornos residenciales y hospitalarios (Bellvitge, Benito Menni, Feixa Llarga, Sant Pere Claver).' },
      ];

      const education = [
        { year: '2015', degree: 'Grado en Terapia Ocupacional (Mención Intervención Avanzada)', school: 'EUIT Terrassa' },
        { year: 'Extra', degree: 'Gestión y Dirección Sanitaria', school: 'Formación Complementaria' },
        { year: 'Extra', degree: 'RCP y Primeros Auxilios', school: 'Formación Complementaria' },
        { year: 'Extra', degree: 'Toma de medidas para medias de compresión', school: 'Formación Complementaria' },
        { year: 'Extra', degree: 'Manipulador de Alimentos', school: 'Formación Complementaria' },
        { year: 'Extra', degree: 'Ventas y Atención al Cliente', school: 'Formación Complementaria' },
      ];

      const skills = [
        { label: 'Geriatría, Rehabilitación y Autonomía', pct: 95 },
        { label: 'Evaluación y Ortopedia', pct: 90 },
        { label: 'Gestión de Recursos y Stock', pct: 85 },
        { label: 'Diseño e Impresión 3D', pct: 80 },
      ];

      return (
        <div className="min-h-screen pt-28 pb-20 px-4 bg-gray-50">
          <div className="max-w-5xl mx-auto">
            <div className="text-center mb-16">
              <span className="inline-block bg-brand-100 text-brand-700 rounded-full px-5 py-2 text-base font-bold uppercase tracking-widest mb-4">Perfil Profesional</span>
              <h1 className="font-display text-4xl sm:text-5xl font-bold text-brand-900 mb-4">Curriculum Vitae Interactivo</h1>
              <div className="section-divider w-24 mx-auto mb-8"></div>

              <div className="max-w-3xl mx-auto space-y-4 text-lg sm:text-xl text-gray-700 leading-relaxed text-left bg-white p-8 sm:p-10 rounded-3xl border border-gray-100 shadow-sm">
                <p>
                  Terapeuta Ocupacional graduado en 2015 con una sólida trayectoria en <strong className="text-brand-700">geriatría y ortopedia</strong>. Mi enfoque se centra en potenciar la autonomía de las personas mediante intervenciones personalizadas que combinan la experiencia clínica con soluciones prácticas y resolutivas para el día a día.
                </p>
                <p>
                  Aprovecho mi conocimiento en herramientas innovadoras como la <strong className="text-brand-700">impresión 3D</strong> para promover el uso de adaptaciones funcionales de bajo coste, buscando siempre que la tecnología sea un puente hacia la independencia. Mi objetivo es mejorar la calidad de vida de mis pacientes, ofreciendo una atención técnica, empática y adaptada a las necesidades reales de cada entorno.
                </p>
              </div>
            </div>

            <div className="grid lg:grid-cols-2 gap-12">
              {/* Experiencia */}
              <div>
                <h3 className="font-display text-2xl font-bold text-brand-900 mb-8 flex items-center gap-3">
                  <span className="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center text-white text-sm font-bold">E</span>
                  Experiencia Profesional
                </h3>
                <ol className="relative space-y-8">
                  {experience.map((exp, i) => (
                    <li key={i} className="relative pl-12 timeline-line">
                      <div className="absolute left-0 top-1 w-10 h-10 bg-brand-600 rounded-full flex items-center justify-center shadow-md z-10">
                        <span className="text-white text-xs font-bold">{experience.length - i}</span>
                      </div>
                      <div className="bg-white border border-brand-100 rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow">
                        <span className="inline-block bg-brand-100 text-brand-600 text-sm font-bold rounded-full px-3 py-1 mb-2">{exp.period}</span>
                        <h4 className="font-bold text-lg text-brand-900 leading-tight">{exp.role}</h4>
                        <p className="text-brand-500 font-medium text-base mb-2">{exp.place}</p>
                        <p className="text-gray-600 text-base leading-relaxed">{exp.desc}</p>
                      </div>
                    </li>
                  ))}
                </ol>
              </div>

              {/* Formación y Skills */}
              <div className="space-y-10">
                <div>
                  <h3 className="font-display text-2xl font-bold text-brand-900 mb-6 flex items-center gap-3">
                    <span className="w-8 h-8 bg-sky-500 rounded-lg flex items-center justify-center text-white text-sm font-bold">H</span>
                    Competencias Destacadas
                  </h3>
                  <ul className="space-y-4">
                    {skills.map((s) => (
                      <li key={s.label}>
                        <div className="flex justify-between mb-1.5">
                          <span className="text-brand-900 font-semibold text-base">{s.label}</span>
                        </div>
                        <div className="w-full bg-brand-100 rounded-full h-3">
                          <div className="bg-gradient-to-r from-brand-400 to-brand-600 h-3 rounded-full" style={{ width: `${s.pct}%` }}></div>
                        </div>
                      </li>
                    ))}
                  </ul>
                </div>

                <div>
                  <h3 className="font-display text-2xl font-bold text-brand-900 mb-6 flex items-center gap-3">
                    <span className="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center text-white text-sm font-bold">F</span>
                    Formación Académica
                  </h3>
                  <ul className="space-y-4">
                    {education.map((e, i) => (
                      <li key={i} className="flex gap-4 bg-white rounded-2xl p-4 border border-brand-100 shadow-sm">
                        <div className="shrink-0 w-14 h-14 bg-brand-50 rounded-xl flex items-center justify-center border border-brand-100">
                          <span className="text-brand-600 font-bold text-sm">{e.year}</span>
                        </div>
                        <div>
                          <p className="font-bold text-brand-900 text-base leading-tight">{e.degree}</p>
                          <p className="text-gray-500 text-sm mt-0.5">{e.school}</p>
                        </div>
                      </li>
                    ))}
                  </ul>
                </div>

                <div>
                  <h3 className="font-display text-2xl font-bold text-brand-900 mb-6 flex items-center gap-3">
                    <span className="w-8 h-8 bg-teal-500 rounded-lg flex items-center justify-center text-white text-sm font-bold">T</span>
                    Herramientas e Idiomas
                  </h3>
                  <div className="bg-white p-5 rounded-2xl border border-brand-100 shadow-sm">
                    <p className="text-gray-700 mb-2"><strong>Idiomas:</strong> Catalán (Nativo), Castellano (Nativo), Inglés (Nivel medio)</p>
                    <p className="text-gray-700 mb-2"><strong>Software:</strong> ResiPlus, Ortogest, Office avanzado</p>
                    <p className="text-gray-700"><strong>Otros:</strong> Diseño y uso de Impresoras 3D, RCP.</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- SECTION ANALYZER ---
    window.SectionAnalyzer = function SectionAnalyzer({ isTeaser, isStandalone }) {
      const { useState, useRef } = React;
      const [step, setStep] = useState('form');
      const [score, setScore] = useState(0);
      const [ringOffset, setRingOffset] = useState(283);
      const [form, setForm] = useState({ tipo: '', ascensor: '', anchoAscensor: '', largoAscensor: '', tipoBanyo: '', barras: '', alzaWC: '', iluminacion: '', puertas: '', movilidad: '', nivelMovilidad: '', capacidadesMotoras: '', notas: '' });

      // New States for AI Image Analysis
      const [file, setFile] = useState(null);
      const [preview, setPreview] = useState(null);
      const [base64, setBase64] = useState(null);
      const [aiResponse, setAiResponse] = useState('');
      const [isDragging, setIsDragging] = useState(false);
      const [aiError, setAiError] = useState('');
      const [savedReports, setSavedReports] = useState([]);

      const resultRef = useRef(null);

      // Cargar historial al inicio
      useEffect(() => {
        const localData = localStorage.getItem('iadapta_reports');
        if (localData) {
          try { setSavedReports(JSON.parse(localData)); } catch (e) {}
        }
      }, []);

      // Guardar informe en el historial
      const saveToHistory = (dataText, sc) => {
        const newReport = {
          id: Date.now(),
          date: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
          score: sc,
          aiResponse: dataText,
          form: { ...form }
        };
        const updated = [newReport, ...savedReports].slice(0, 10);
        setSavedReports(updated);
        localStorage.setItem('iadapta_reports', JSON.stringify(updated));
      };

      // Auto-guardado de borrador
      useEffect(() => {
        const draft = localStorage.getItem('iadapta_draft');
        if (draft) {
          try { setForm(JSON.parse(draft)); } catch(e) {}
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('iadapta_draft', JSON.stringify(form));
      }, [form]);

      const loadFromHistory = (report) => {
        setForm(report.form);
        setAiResponse(report.aiResponse);
        setScore(report.score);
        setStep('results');
        setTimeout(() => setRingOffset(283 - (283 * report.score / 100)), 100);
      };

      const deleteFromHistory = (e, id) => {
        e.stopPropagation();
        const updated = savedReports.filter(r => r.id !== id);
        setSavedReports(updated);
        localStorage.setItem('iadapta_reports', JSON.stringify(updated));
      };

      const handleChange = (e) => setForm(f => ({ ...f, [e.target.name]: e.target.value }));

      const handleDragOver = (e) => { e.preventDefault(); setIsDragging(true); };
      const handleDragLeave = (e) => { e.preventDefault(); setIsDragging(false); };
      const handleDrop = (e) => {
        e.preventDefault(); setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFile(e.dataTransfer.files[0]);
        }
      };
      const handleFileSelect = (e) => {
        if (e.target.files && e.target.files[0]) {
          handleFile(e.target.files[0]);
        }
      };

      const handleFile = (selectedFile) => {
        setFile(selectedFile);
        setPreview(URL.createObjectURL(selectedFile));
        
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64Str = reader.result;
          
          // Compresión inmediata al cargar
          const img = new Image();
          img.src = base64Str;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const MAX_SIZE = 800;
            if (width > height) {
              if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
            } else {
              if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const optimized = canvas.toDataURL('image/jpeg', 0.6); // 60% calidad para ligereza total
            setBase64(optimized.split(',')[1]);
          };
        };
        reader.readAsDataURL(selectedFile);
      };

      const removeFile = () => {
        setFile(null); setPreview(null); setBase64(null);
      };

      const calcScore = () => {
        let pts = 50;
        if (form.tipoBanyo === 'ducha') pts += 10;
        if (form.barras === 'si') pts += 10;
        if (form.alzaWC === 'si') pts += 10;
        if (form.iluminacion === 'buena') pts += 10; else if (form.iluminacion === 'media') pts += 5;
        if (form.puertas === 'ancha') pts += 10; else if (form.puertas === 'estandar') pts += 5;

        if (form.ascensor === 'no') pts -= 10;
        if (form.anchoAscensor === 'estrecha' || form.puertas === 'estrecha') pts -= 15;

        if (form.nivelMovilidad === 'asistencia' || form.nivelMovilidad === 'encamado') pts -= 15;
        if (form.capacidadesMotoras === 'inestabilidad') pts -= 10;

        return Math.max(0, Math.min(pts, 100));
      };

      const getRecommendations = (sc) => {
        const all = [];

        // Lógica de Espacios Críticos
        if (form.puertas === 'estrecha' || (form.ascensor === 'si' && form.anchoAscensor === 'estrecha')) {
          all.push({
            cond: true, icon: '⚠️', prio: 'Alta',
            text: 'AVISO DE ACCESIBILIDAD PRIORITARIO: Tus pasos de puerta o el acceso al ascensor son reducidos (≤ 60 cm). Antes de comprar cualquier silla o andador, asegúrate de que el ancho total del producto no supere los 55 cm para garantizar un paso seguro y sin colisiones.',
          });
        }

        if (form.ascensor === 'no') {
          all.push({
            cond: true, icon: '🏢', prio: 'Alta',
            text: 'Al no disponer de ascensor, la accesibilidad exterior es crítica. Te recomendamos valorar con la comunidad de vecinos o propietarios la instalación de soluciones como un ascensor, salvaescaleras o rampas normativas para garantizar una entrada y salida del hogar segura y sin barreras.',
          });
        }

        // Lógica de Baño
        if (form.tipoBanyo === 'banera') {
          all.push({
            cond: true, icon: '🚿', prio: 'Alta',
            text: 'Al disponer de bañera, el riesgo de caída al intentar salvar el borde es elevado. Te recomendamos el uso de una Tabla de Bañera. Este dispositivo permite realizar la entrada y salida sentado, eliminando la necesidad de mantener el equilibrio a una sola pierna mientras se supera el obstáculo.',
            linkText: 'Ver tabla de bañera recomendada', linkUrl: 'https://amzn.to/4uLnkU5'
          });
        } else if (form.tipoBanyo === 'ducha') {
          all.push({
            cond: true, icon: '🚿', prio: 'Media',
            text: 'Contar con ducha es un gran paso, pero para una higiene segura y sin fatiga, es fundamental realizarla en sedestación. Un asiento o banqueta de ducha te proporcionará la estabilidad necesaria y evitará resbalones por cansancio durante el aseo.',
            linkText: 'Ver asiento de ducha', linkUrl: 'https://amzn.to/4dfjkUJ'
          });
        }

        if (form.barras === 'no') {
          all.push({
            cond: true, icon: '🦾', prio: 'Alta',
            text: 'La ausencia de barras de apoyo incrementa el riesgo de pérdida de equilibrio. Instalar asideros técnicos en puntos estratégicos (entrada de ducha e inodoro) es vital para ofrecer puntos de palanca seguros y compensar posibles debilidades musculares.',
            linkText: 'Ver barras de apoyo', linkUrl: 'https://amzn.to/4u4JBw3'
          });
        }

        if (form.alzaWC === 'no') {
          all.push({
            cond: true, icon: '🚽', prio: 'Media',
            text: 'Un inodoro a altura estándar puede ser difícil de usar si hay debilidad en las piernas. Un alza de WC reduce el esfuerzo requerido para sentarse y levantarse, protegiendo las articulaciones de cadera y rodilla y fomentando tu autonomía.',
            linkText: 'Ver alza de WC', linkUrl: 'https://amzn.to/42hlsWU'
          });
        }

        // Otras recomendaciones (mantenidas y adaptadas)
        if (form.iluminacion !== 'buena' && form.iluminacion !== '') {
          all.push({
            cond: true, icon: '💡', prio: 'Media',
            text: 'Consejo Técnico: Una iluminación deficiente es precursora de tropiezos. Instala luces automáticas con sensor de movimiento cerca del suelo en los trayectos nocturnos para asegurar una visibilidad clara sin necesidad de buscar interruptores.'
          });
        }

        if (form.movilidad === 'baston' || form.movilidad === 'andador') {
          all.push({
            cond: true, icon: '🦯', prio: 'Alta',
            text: 'Seguridad en la Marcha: Es vital retirar todas las alfombras y obstáculos. Verifica que las conteras de tu ayuda técnica no estén gastadas; sustituirlas por modelos antideslizantes de base ancha mejorará drásticamente tu estabilidad.',
            linkText: 'Ver conteras antideslizantes', linkUrl: 'https://amzn.to/4uw9fth'
          });
        }

        return all;
      };

      const getPositiveFindings = () => {
        const positives = [];
        if (form.tipoBanyo === 'ducha') positives.push({ icon: '✅', text: 'Dispones de plato de ducha, lo que facilita enormemente el acceso y reduce el riesgo de tropiezos comparado con una bañera.' });
        if (form.barras === 'si') positives.push({ icon: '✅', text: 'Cuentas con barras de apoyo instaladas, un elemento clave para la estabilidad en las transferencias.' });
        if (form.alzaWC === 'si') positives.push({ icon: '✅', text: 'El uso de alza de WC es un punto fuerte que protege tus articulaciones y facilita la bipedestación.' });
        if (form.iluminacion === 'buena') positives.push({ icon: '✅', text: 'La buena iluminación detectada es fundamental para la seguridad visual y la prevención de caídas.' });
        if (form.puertas === 'ancha') positives.push({ icon: '✅', text: 'Tus puertas anchas garantizan un paso fluido y son compatibles con la mayoría de ayudas técnicas.' });
        if (form.nivelMovilidad === 'independiente') positives.push({ icon: '✅', text: 'Tu nivel de independencia actual es un gran activo; las adaptaciones ayudarán a preservarlo por más tiempo.' });
        return positives;
      };

      const isQuestionnaireComplete = () => {
        const requiredFields = ['tipo', 'ascensor', 'tipoBanyo', 'barras', 'alzaWC', 'iluminacion', 'puertas', 'movilidad', 'nivelMovilidad', 'capacidadesMotoras'];
        return requiredFields.every(field => form[field] !== '');
      };

      const prioBadge = { Alta: 'bg-red-100 text-red-700', Media: 'bg-amber-100 text-amber-700', Info: 'bg-brand-100 text-brand-700' };

      const handleAnalyze = async (e) => {
        e.preventDefault();
        
        if (!isQuestionnaireComplete()) {
          setAiError("Por favor, completa todas las preguntas del cuestionario antes de realizar el análisis por IA.");
          return;
        }

        setStep('loading');
        setAiError('');
        setAiResponse('');

// Se ha eliminado la función redundante resizeImage aquí porque ahora se hace en handleFile

        if (base64) {
          try {
            const response = await fetch('/api/analyze?t=' + Date.now(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                base64: base64,
                mimeType: 'image/jpeg',
                answers: form
              })
            });

            const textResponse = await response.text();
            let data;
            try {
              data = JSON.parse(textResponse);
            } catch (jsonErr) {
              console.error("Error al parsear JSON:", textResponse);
              throw new Error("El servidor no respondió en formato JSON. Respuesta técnica: " + textResponse.substring(0, 150));
            }

            if (data.error) throw new Error(data.error);

            if (data.text) {
              // Formateamos títulos ## y ### a h3 estilizados (limpieza total de símbolos)
              let formatted = data.text.replace(/^[#]{2,3}\s?(.*?)$/gm, '<h3 class="text-xl font-bold text-indigo-900 mt-6 mb-3 border-b border-indigo-100 pb-2">$1</h3>');
              // Formateamos negritas (Markdown ** a <strong>)
              formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
              // Convertimos listas de asteriscos (* ) en puntos tipográficos (•)
              formatted = formatted.replace(/^\*\s/gm, '• ');
              
              // Destacamos el aviso legal inicial
              const disclaimerText = "Este análisis ha sido generado mediante Inteligencia Artificial (modelo Gemini 2.0 Flash) en fase de pruebas. La información proporcionada es orientativa y puede contener errores. Debe ser validada por un profesional cualificado antes de realizar cualquier cambio estructural.";
              if (formatted.includes(disclaimerText)) {
                formatted = formatted.replace(disclaimerText, `<div class="bg-amber-50 border-l-4 border-amber-400 p-4 mb-6 text-amber-800 italic text-base leading-relaxed">${disclaimerText}</div>`);
              }
              
              setAiResponse(formatted);
              setStep('results');
              saveToHistory(formatted, calcScore()); // Guardamos automáticamente
            } else {
              throw new Error('No se pudo generar una respuesta.');
            }
          } catch (err) {
            console.error(err);
            setAiError(err.message || 'Error al procesar la imagen con la IA.');
            setStep('results');
          }
        } else {
          setStep('results');
        }

        const sc = calcScore();
        setScore(sc);
        setTimeout(() => setRingOffset(283 - (283 * sc / 100)), 100);
        setTimeout(() => {
          resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 200);
      };

      const reset = () => {
        setStep('form'); setScore(0); setRingOffset(283);
        const emptyForm = { tipo: '', ascensor: '', anchoAscensor: '', largoAscensor: '', tipoBanyo: '', barras: '', alzaWC: '', iluminacion: '', puertas: '', movilidad: '', nivelMovilidad: '', capacidadesMotoras: '', notas: '' };
        setForm(emptyForm);
        localStorage.removeItem('iadapta_draft');
        setFile(null); setPreview(null); setBase64(null); setAiResponse(''); setAiError('');
      };

      const scoreColor = score >= 75 ? '#22c55e' : score >= 45 ? '#f59e0b' : '#ef4444';
      const scoreLabel = score >= 75 ? 'Buena accesibilidad' : score >= 45 ? 'Accesibilidad mejorable' : 'Accesibilidad limitada';

      const fieldClass = "w-full border-2 border-brand-200 rounded-xl px-4 py-3 text-lg text-gray-800 bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200 transition-all appearance-none";
      const labelClass = "block text-base font-bold text-brand-800 mb-2";

      if (isTeaser) {
        return (
          <section id="analyzer" className="py-24 px-4 bg-gradient-to-b from-sky-50 to-white">
            <div className="max-w-4xl mx-auto">
              <div className="text-center mb-14">
                <span className="inline-block bg-sky-100 text-sky-700 rounded-full px-5 py-2 text-base font-bold uppercase tracking-widest mb-4">Inteligencia Artificial</span>
                <h2 className="font-display text-4xl sm:text-5xl font-bold text-brand-900 mb-4">Analizador de Accesibilidad</h2>
                <div className="section-divider w-24 mx-auto mb-6"></div>
                <p className="text-xl text-gray-600 max-w-2xl mx-auto mb-10">
                  Sube una foto de una estancia o responde a nuestro cuestionario para identificar barreras arquitectónicas en tu hogar.
                </p>

                <div 
                  onClick={() => {
                    const baseUrl = window.location.href.split('?')[0];
                    window.open(`${baseUrl}?page=analyzer`, '_blank');
                  }}
                  className="rounded-3xl overflow-hidden shadow-2xl border border-brand-100 max-w-3xl mx-auto mb-10 relative group cursor-pointer"
                >
                  <img src="assets/ai_analyzer.jpg" alt="Analizador de Accesibilidad" className="w-full h-auto object-cover group-hover:scale-105 transition-transform duration-700" />
                  <div className="absolute inset-0 bg-brand-900/10 group-hover:bg-transparent transition-colors flex items-center justify-center">
                    <div className="bg-white/90 p-4 rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-opacity transform scale-90 group-hover:scale-100">
                      <Icons.Brain />
                    </div>
                  </div>
                </div>

                <button
                  onClick={() => {
                    const baseUrl = window.location.href.split('?')[0];
                    window.open(`${baseUrl}?page=analyzer`, '_blank');
                  }}
                  className="px-10 py-5 bg-sky-600 text-white rounded-2xl font-bold text-xl hover:bg-sky-700 transition-all shadow-xl hover:shadow-2xl btn-pulse flex items-center gap-3 mx-auto"
                >
                  <Icons.Brain />
                  Abrir Analizador IA
                </button>
              </div>
            </div>
          </section>
        );
      }

      return (
        <section id="analyzer-full" className={`py-24 px-4 ${isStandalone ? 'pt-32' : ''} bg-gradient-to-b from-sky-50 to-white min-h-screen`}>
          <div className="max-w-4xl mx-auto">
            <div className="text-center mb-14">
              {isStandalone && (
                <button
                  onClick={() => window.close()}
                  className="mb-8 inline-flex items-center gap-2 text-sky-600 font-bold hover:text-sky-800 transition-colors"
                >
                  <svg className="w-5 h-5 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" /></svg>
                  Cerrar ventana
                </button>
              )}
              <span className="inline-block bg-sky-100 text-sky-700 rounded-full px-5 py-2 text-base font-bold uppercase tracking-widest mb-4">Inteligencia Artificial</span>
              <h2 className="font-display text-4xl sm:text-5xl font-bold text-brand-900 mb-4">Analizador de Accesibilidad</h2>
              <div className="section-divider w-24 mx-auto mb-6"></div>
              <p className="text-xl text-gray-600 max-w-2xl mx-auto mb-10">
                Sube una foto de una estancia (baño, cocina...) y nuestra conexión con Gemini Vision identificará las barreras arquitectónicas.
              </p>
            </div>

            {step === 'form' && (
              <div className="anim-fade-up">
                
                {/* HISTORIAL DE INFORMES */}
                {savedReports.length > 0 && (
                  <div className="mb-12 bg-indigo-50/50 border border-indigo-100 rounded-3xl p-6 sm:p-8">
                    <h3 className="text-xl font-bold text-indigo-900 mb-6 flex items-center gap-3">
                      <Icons.History /> Mis Informes Guardados
                    </h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                      {savedReports.map(report => (
                        <div 
                          key={report.id} 
                          onClick={() => loadFromHistory(report)}
                          className="bg-white p-5 rounded-2xl border border-indigo-100 shadow-sm hover:shadow-md hover:border-indigo-300 transition-all cursor-pointer group relative"
                        >
                          <button 
                            onClick={(e) => deleteFromHistory(e, report.id)}
                            className="absolute top-2 right-2 p-2 text-gray-300 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100"
                            title="Eliminar informe"
                          >
                            <Icons.X />
                          </button>
                          <div className="flex items-center gap-3 mb-3">
                            <div className="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-lg flex items-center justify-center font-bold">
                              {report.score}
                            </div>
                            <p className="text-sm font-bold text-gray-500">{report.date}</p>
                          </div>
                          <p className="text-brand-900 font-bold truncate">
                            {report.form.tipo === 'banyo' ? 'Análisis de Baño' : report.form.tipo === 'cocina' ? 'Análisis de Cocina' : 'Análisis de Vivienda'}
                          </p>
                          <p className="text-xs text-brand-600 font-semibold mt-1">Hacer clic para ver informe →</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <form onSubmit={handleAnalyze} className="bg-white rounded-3xl border border-brand-100 shadow-xl p-8 md:p-10 anim-scale-in" noValidate>

                {/* DRAG AND DROP ZONE */}
                <div className="mb-10">
                  <h3 className="text-xl font-bold text-brand-900 mb-4 flex items-center gap-2">
                    <Icons.Brain /> Análisis Visual (API Gemini)
                  </h3>

                  {!file ? (
                    <div
                      className={`border-3 border-dashed rounded-2xl p-10 text-center transition-all ${isDragging ? 'border-brand-500 bg-brand-50' : 'border-gray-300 hover:border-brand-400 bg-gray-50'}`}
                      onDragOver={handleDragOver}
                      onDragLeave={handleDragLeave}
                      onDrop={handleDrop}
                    >
                      <svg className="w-12 h-12 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                      <p className="text-lg font-semibold text-gray-700 mb-2">Arrastra aquí una foto de tu baño o estancia</p>
                      <p className="text-sm text-gray-500 mb-4">o pulsa para seleccionarla desde tu dispositivo</p>
                      <input type="file" accept="image/*" onChange={handleFileSelect} className="hidden" id="file-upload" />
                      <label htmlFor="file-upload" className="inline-block px-6 py-2 bg-white border-2 border-brand-200 text-brand-700 font-bold rounded-xl cursor-pointer hover:bg-brand-50 transition-colors">Seleccionar Archivo</label>
                    </div>
                  ) : (
                    <div className="relative border border-brand-200 rounded-2xl p-4 bg-brand-50 flex flex-col items-center">
                      <img src={preview} alt="Vista previa" className="max-h-64 rounded-xl shadow-md mb-4 object-contain" />
                      <p className="font-semibold text-brand-800">{file.name}</p>
                      <button type="button" onClick={removeFile} className="mt-2 text-red-600 hover:text-red-800 text-sm font-bold underline">Quitar imagen</button>
                    </div>
                  )}
                </div>

                <hr className="my-10 border-brand-100" />

                <h3 className="text-xl font-bold text-brand-900 mb-6 flex items-center gap-2">
                  <Icons.Check /> Cuestionario Manual
                </h3>

                <div className="grid sm:grid-cols-2 gap-6">
                  <div>
                    <label className={labelClass}>Tipo de vivienda</label>
                    <select name="tipo" value={form.tipo} onChange={handleChange} className={fieldClass} required>
                      <option value="">— Selecciona —</option>
                      <option value="piso">Piso</option>
                      <option value="casa">Casa</option>
                    </select>
                  </div>
                  <div>
                    <label className={labelClass}>¿Dispone de ascensor?</label>
                    <select name="ascensor" value={form.ascensor} onChange={handleChange} className={fieldClass}>
                      <option value="">— Selecciona —</option>
                      <option value="si">Sí</option>
                      <option value="no">No</option>
                      <option value="no-precisa">No precisa (p. baja)</option>
                    </select>
                  </div>

                  {form.ascensor === 'si' && (
                    <>
                      <div className="anim-fade-in">
                        <label className={labelClass}>Ancho de puerta del ascensor</label>
                        <select name="anchoAscensor" value={form.anchoAscensor} onChange={handleChange} className={fieldClass}>
                          <option value="">— Selecciona —</option>
                          <option value="estrecha">&lt; 60 cm (Estrecha)</option>
                          <option value="estandar">60-70 cm (Estándar)</option>
                          <option value="ancha">&gt; 70 cm (Ancha)</option>
                        </select>
                      </div>
                      <div className="anim-fade-in">
                        <label className={labelClass}>Largo del interior del ascensor</label>
                        <select name="largoAscensor" value={form.largoAscensor} onChange={handleChange} className={fieldClass}>
                          <option value="">— Selecciona —</option>
                          <option value="estrecho">&lt; 80 cm (Estrecho)</option>
                          <option value="medio">80-95 cm</option>
                          <option value="grande">&gt; 95 cm</option>
                        </select>
                      </div>
                    </>
                  )}

                  <div>
                    <label className={labelClass}>¿Tiene bañera o ducha?</label>
                    <select name="tipoBanyo" value={form.tipoBanyo} onChange={handleChange} className={fieldClass} required>
                      <option value="">— Selecciona —</option>
                      <option value="banera">Bañera</option>
                      <option value="ducha">Ducha</option>
                    </select>
                  </div>
                  <div>
                    <label className={labelClass}>¿Tiene barras de apoyo instaladas?</label>
                    <select name="barras" value={form.barras} onChange={handleChange} className={fieldClass}>
                      <option value="">— Selecciona —</option>
                      <option value="si">Sí</option>
                      <option value="no">No</option>
                    </select>
                  </div>
                  <div>
                    <label className={labelClass}>¿Tiene alza de WC?</label>
                    <select name="alzaWC" value={form.alzaWC} onChange={handleChange} className={fieldClass}>
                      <option value="">— Selecciona —</option>
                      <option value="si">Sí</option>
                      <option value="no">No</option>
                    </select>
                  </div>

                  <div>
                    <label className={labelClass}>Ancho de puertas de la casa</label>
                    <select name="puertas" value={form.puertas} onChange={handleChange} className={fieldClass}>
                      <option value="">— Selecciona —</option>
                      <option value="estrecha">≤ 60 cm (Estrecha)</option>
                      <option value="estandar">60-70 cm (Estándar)</option>
                      <option value="ancha">&gt; 70 cm (Ancha)</option>
                    </select>
                  </div>

                  <div>
                    <label className={labelClass}>Iluminación general</label>
                    <select name="iluminacion" value={form.iluminacion} onChange={handleChange} className={fieldClass}>
                      <option value="">— Selecciona —</option>
                      <option value="buena">Buena (luz natural + artificial)</option>
                      <option value="media">Media (algunas zonas oscuras)</option>
                      <option value="mala">Insuficiente / deficiente</option>
                    </select>
                  </div>
                  <div>
                    <label className={labelClass}>Ayuda técnica que usas</label>
                    <select name="movilidad" value={form.movilidad} onChange={handleChange} className={fieldClass}>
                      <option value="">— Selecciona —</option>
                      <option value="ninguna">Ninguna</option>
                      <option value="baston">Bastón</option>
                      <option value="andador">Andador</option>
                      <option value="silla">Silla de ruedas</option>
                    </select>
                  </div>
                  <div>
                    <label className={labelClass}>Nivel de movilidad</label>
                    <select name="nivelMovilidad" value={form.nivelMovilidad} onChange={handleChange} className={fieldClass}>
                      <option value="">— Selecciona —</option>
                      <option value="independiente">Independiente total</option>
                      <option value="supervision">Requiere supervisión</option>
                      <option value="asistencia">Requiere asistencia física</option>
                      <option value="encamado">Encamado / Gran dependencia</option>
                    </select>
                  </div>
                  <div>
                    <label className={labelClass}>Capacidades motoras</label>
                    <select name="capacidadesMotoras" value={form.capacidadesMotoras} onChange={handleChange} className={fieldClass}>
                      <option value="">— Selecciona —</option>
                      <option value="conservadas">Fuerza y equilibrio normales</option>
                      <option value="debilidad">Pérdida de fuerza o artritis</option>
                      <option value="inestabilidad">Problemas de equilibrio frecuentes</option>
                    </select>
                  </div>
                </div>
                <div className="mt-8 flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">
                  <p className="text-base text-gray-500 flex items-center gap-2"><Icons.Shield /> Tus datos no se envían a ningún servidor.</p>
                  <div className="flex flex-col items-center sm:items-end w-full sm:w-auto mt-4 sm:mt-0">
                    <button type="submit" className="px-10 py-4 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xl rounded-2xl shadow-lg transition-all btn-pulse w-full sm:w-auto">
                      {file ? 'Analizar con Gemini IA' : 'Analizar Cuestionario'}
                    </button>
                    <p className="text-xs text-gray-400 mt-3 text-center sm:text-right max-w-xs">
                      * El análisis por IA se encuentra en fase beta (v1.5.1).
                    </p>
                  </div>
                </div>
              </form>
            </div>
          )}

            {step === 'loading' && (
              <div className="text-center py-20 anim-fade-in">
                <div className="w-20 h-20 border-4 border-brand-200 border-t-brand-600 rounded-full anim-spin mx-auto mb-6"></div>
                <p className="text-2xl font-bold text-brand-800 mb-2">{file ? 'Gemini está analizando la imagen...' : 'Analizando tu hogar…'}</p>
                <p className="text-lg text-gray-500">Aplicando criterios de accesibilidad universal</p>
              </div>
            )}

            {step === 'results' && (
              <div ref={resultRef} className="anim-scale-in">

                {/* AI DIAGNOSTICS RESULT */}
                {(aiResponse || aiError) && (
                  <div className={`rounded-3xl border shadow-xl p-8 md:p-10 mb-8 ${aiError ? 'bg-red-50 border-red-200' : 'bg-gradient-to-br from-indigo-50 to-white border-indigo-100'}`}>
                    <h3 className={`font-display text-2xl font-bold mb-4 flex items-center gap-3 ${aiError ? 'text-red-800' : 'text-indigo-900'}`}>
                      <Icons.Brain /> {aiError ? 'Error en el Análisis IA' : 'Diagnóstico Preliminar Gemini Vision'}
                    </h3>
                    {aiError ? (
                      <p className="text-red-700">{aiError}</p>
                    ) : (
                      <div className="prose prose-indigo max-w-none text-gray-700 whitespace-pre-wrap text-lg ai-report-content">
                        {aiResponse.split(/(\[+PRODUCTO?[:\s]*\d+\]+)/gi).map((part, i) => {
                          const productMatch = part.match(/PRODUCTO?[:\s]*(\d+)/i);
                          if (productMatch) {
                            const productId = productMatch[1];
                            const products = {
                              // BAÑO
                              '1': { name: 'Tabla de bañera', url: 'https://amzn.to/4uLnkU5', img: 'assets/tabla_banera.png' },
                              '2': { name: 'Asiento para ducha', url: 'https://amzn.to/4dfjkUJ', img: 'assets/asiento_ducha.png' },
                              '3': { name: 'Barras de apoyo', url: 'https://amzn.to/4u4JBw3', img: 'assets/barras_apoyo.png' },
                              '4': { name: 'Alza de WC', url: 'https://amzn.to/42hlsWU', img: 'assets/alza_wc.png' },
                              '5': { name: 'Asiento giratorio bañera', url: 'https://amzn.to/4d3bjlv', img: 'assets/asiento_banera.jpg' },
                              
                              // DORMITORIO
                              '6': { name: 'Barandilla extensible', url: 'https://amzn.to/42hT9Yu', img: 'assets/barandilla_cama.jpg' },
                              '7': { name: 'Trapecio Universal', url: 'https://amzn.to/3PqiHj4', img: 'assets/trapecio_cama.jpg' },
                              '8': { name: 'Tacos elevadores cama', url: 'https://amzn.to/4tXN3Zo', img: 'assets/tacos_cama.jpg' },
                              
                              // COCINA / ALIMENTACIÓN
                              '9': { name: 'Cubiertos adaptados', url: 'https://amzn.to/4wi1BVq', img: 'assets/cubiertos_adaptados.jpg' },
                              '10': { name: 'Cuchillo Nelson', url: 'https://amzn.to/3QPzqgd', img: 'assets/cuchillo_nelson.jpg' },
                              '11': { name: 'Tabla de cortar adaptada', url: 'https://amzn.to/42CtdHf', img: 'assets/tabla_cortar.jpg' },
                              '12': { name: 'Plato con reborde alto', url: 'https://amzn.to/4d2KwXN', img: 'assets/plato_reborde.jpg' },
                              '13': { name: 'Vaso con escotadura nasal', url: 'https://amzn.to/3R1tYXJ', img: 'assets/vaso_escotadura.jpg' },
                              
                              // MOVILIDAD
                              '14': { name: 'Andador interior', url: 'https://amzn.to/49eGadM', img: 'assets/andador_interior.jpg' },
                              '15': { name: 'Andador Rollator (exterior)', url: 'https://amzn.to/4nioy6O', img: 'assets/andador_exterior.jpg' },
                              '16': { name: 'Conteras antideslizantes', url: 'https://amzn.to/4uw9fth', img: 'assets/conteras.jpg' }
                            };
                            const p = products[productId];
                            if (!p) return null;
                            return (
                              <div key={i} className="my-8 bg-white border border-brand-100 rounded-2xl p-4 shadow-md flex flex-col sm:flex-row items-center gap-6 no-print">
                                <img src={p.img} alt={p.name} className="w-32 h-32 object-cover rounded-xl border border-gray-100" />
                                <div className="flex-1 text-center sm:text-left">
                                  <h4 className="text-xl font-bold text-brand-900 mb-2">{p.name}</h4>
                                  <p className="text-sm text-gray-500 mb-4">Producto técnico recomendado profesionalmente.</p>
                                  <a href={p.url} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-[#FF9900] text-white px-6 py-2.5 rounded-xl font-bold hover:bg-[#e68a00] transition-all shadow-sm">
                                    Ver en Amazon
                                  </a>
                                </div>
                              </div>
                            );
                          }
                          return <div key={i} dangerouslySetInnerHTML={{ __html: part }} />;
                        })}
                      </div>
                    )}
                    
                    <div className="mt-10 flex justify-center no-print">
                      <button 
                        onClick={() => window.print()} 
                        className="flex items-center gap-3 px-8 py-4 bg-brand-800 text-white font-bold rounded-2xl hover:bg-brand-900 transition-all shadow-xl"
                      >
                        <Icons.Download />
                        Descargar Informe en PDF
                      </button>
                    </div>
                  </div>
                )}

                <div className="bg-white rounded-3xl border border-brand-100 shadow-xl p-8 md:p-12 mb-8 text-center">
                  <h3 className="font-display text-2xl font-bold text-brand-900 mb-8">Puntuación del Cuestionario</h3>
                  <div className="flex flex-col sm:flex-row items-center justify-center gap-10">
                    <div className="relative w-44 h-44">
                      <svg viewBox="0 0 100 100" className="w-full h-full -rotate-90">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="#dbeafe" strokeWidth="8" />
                        <circle cx="50" cy="50" r="45" fill="none" stroke={scoreColor} strokeWidth="8" strokeLinecap="round" strokeDasharray="283" strokeDashoffset={ringOffset} style={{ transition: 'stroke-dashoffset 1.6s ease' }} />
                      </svg>
                      <div className="absolute inset-0 flex flex-col items-center justify-center">
                        <span className="text-4xl font-bold" style={{ color: scoreColor }}>{score}</span>
                        <span className="text-sm font-semibold text-gray-500">/ 100</span>
                      </div>
                    </div>
                    <div className="text-left">
                      <p className="text-2xl font-bold mb-2" style={{ color: scoreColor }}>{scoreLabel}</p>
                      <p className="text-lg text-gray-600 max-w-sm leading-relaxed">
                        {score >= 75 ? 'Tu hogar tiene una buena base de accesibilidad. Revisa las recomendaciones para optimizarlo.' : score >= 45 ? 'Hay áreas de mejora importantes. Abordar las prioridades altas reducirá el riesgo de caídas significativamente.' : 'El hogar presenta barreras relevantes. Te recomendamos una evaluación presencial con terapeuta ocupacional.'}
                      </p>
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-3xl border border-brand-100 shadow-xl p-8 md:p-10 mb-8">
                  <h3 className="font-display text-2xl font-bold text-brand-900 mb-6">Puntos fuertes detectados</h3>
                  {getPositiveFindings().length === 0 ? (
                    <p className="text-gray-500 italic">No se han identificado puntos fuertes específicos en este análisis.</p>
                  ) : (
                    <ul className="space-y-3">
                      {getPositiveFindings().map((p, i) => (
                        <li key={i} className="flex gap-3 p-4 rounded-xl bg-emerald-50 border border-emerald-100 text-emerald-800 font-medium">
                          <span className="shrink-0">{p.icon}</span>
                          {p.text}
                        </li>
                      ))}
                    </ul>
                  )}
                </div>

                <div className="bg-white rounded-3xl border border-brand-100 shadow-xl p-8 md:p-10 mb-8">
                  <h3 className="font-display text-2xl font-bold text-brand-900 mb-6">Recomendaciones del cuestionario</h3>
                  {getRecommendations(score).length === 0 ? (
                    <p className="text-lg text-green-700 font-semibold">¡Excelente! No se detectaron barreras significativas.</p>
                  ) : (
                    <ul className="space-y-4">
                      {getRecommendations(score).map((r, i) => (
                        <li key={i} className="flex gap-4 p-4 sm:p-6 rounded-2xl bg-gray-50 border border-gray-100">
                          <span className="text-2xl shrink-0 mt-1">{r.icon}</span>
                          <div>
                            <span className={`inline-block text-xs font-bold uppercase tracking-widest rounded-full px-3 py-1 mb-2 ${prioBadge[r.prio]}`}>Prioridad {r.prio}</span>
                            <p className="text-gray-800 text-base leading-relaxed">{r.text}</p>
                            {r.linkUrl && (
                              <a href={r.linkUrl} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1.5 mt-3 text-brand-600 font-bold hover:text-brand-800 transition-colors bg-brand-50 px-3 py-1.5 rounded-lg border border-brand-100">
                                Ver producto recomendado
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                              </a>
                            )}
                          </div>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>

                <div className="flex flex-col sm:flex-row gap-4 justify-center no-print">
                  <button onClick={reset} className="px-8 py-4 bg-white border-2 border-brand-300 text-brand-700 font-bold text-lg rounded-2xl hover:bg-brand-50 transition-all">Nuevo análisis</button>
                  <button onClick={() => document.getElementById('contact').scrollIntoView({ behavior: 'smooth' })} className="px-8 py-4 bg-brand-600 text-white font-bold text-lg rounded-2xl hover:bg-brand-700 shadow-lg transition-all">Solicitar evaluación presencial</button>
                </div>
              </div>
            )}
          </div>
        </section>
      );
    };

    // --- SECTION GUIDES ---
    window.ArticleBlock = function ArticleBlock({ article, getAmazonLink, onCategoryChange }) {
      const [isExpanded, setIsExpanded] = React.useState(false);

      return (
        <div className="flex flex-col lg:flex-row gap-10">
          <div className="flex-1">
            <div className="mb-8 rounded-2xl overflow-hidden border border-gray-100 shadow-sm relative group cursor-pointer" onClick={() => setIsExpanded(true)}>
              <img src={article.image} alt={article.title} className="w-full h-64 sm:h-80 object-cover group-hover:scale-105 transition-transform duration-700" />
              {!isExpanded && (
                <div className="absolute inset-0 bg-black bg-opacity-10 group-hover:bg-opacity-0 transition-all flex items-center justify-center opacity-0 group-hover:opacity-100">
                  <span className="bg-white text-gray-900 px-4 py-2 rounded-full font-bold shadow-lg text-sm">Ver detalles</span>
                </div>
              )}
            </div>
            <h4 className="text-2xl font-bold text-brand-900 mb-5">{article.title}</h4>

            <div className="text-lg">
              {article.renderText(isExpanded, onCategoryChange)}
            </div>

            {article.hasMore && (
              <button
                onClick={() => setIsExpanded(!isExpanded)}
                className="mt-6 font-bold text-indigo-600 hover:text-indigo-800 transition-colors flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 px-5 py-2.5 rounded-full text-sm shadow-sm"
              >
                {isExpanded ? 'Mostrar menos' : 'Leer artículo completo'}
                <svg className={`w-4 h-4 transform transition-transform ${isExpanded ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
              </button>
            )}
          </div>

          <div className="lg:w-1/3 bg-gray-50 rounded-2xl p-6 border border-brand-100 shadow-sm self-start sticky top-24">
            <h5 className="font-bold text-brand-800 uppercase tracking-wide text-sm mb-4 flex items-center gap-2">
              <Icons.Check /> Material recomendado
            </h5>

                    {isOpen && (
                      <div className="p-8 anim-fade-in">
                        {cat.articles.map((article, idx) => (
                          <ArticleBlock key={idx} article={article} getAmazonLink={getAmazonLink} onCategoryChange={setOpenCategory} />
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </section>
      );
    };

    // --- SECTION CONTACT ---
    window.SectionContact = function SectionContact() {
      const { useState } = React;
      const [form, setForm] = useState({ nombre: '', email: '', telefono: '', motivo: '', mensaje: '' });
      const [sent, setSent] = useState(false);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handle = (e) => setForm(f => ({ ...f, [e.target.name]: e.target.value }));

      const validate = () => {
        if (!form.nombre.trim()) return 'Por favor, indica tu nombre.';
        if (!form.email.trim() || !/\S+@\S+\.\S+/.test(form.email)) return 'Introduce un correo electrónico válido.';
        if (!form.mensaje.trim()) return 'El mensaje no puede estar vacío.';
        return '';
      };

      const submit = (e) => {
        e.preventDefault();
        const err = validate();
        if (err) { setError(err); return; }
        setError('');
        setLoading(true);
        setTimeout(() => { setLoading(false); setSent(true); }, 1800);
      };

      const labelClass = "block text-base font-bold text-brand-800 mb-2";
      const inputClass = "w-full border-2 border-brand-200 rounded-xl px-4 py-3.5 text-lg text-gray-800 bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200 transition-all";

      const info = [
        { icon: <Icons.Mail />, label: 'Correo electrónico', value: 'iadaptato@gmail.com', href: 'mailto:iadaptato@gmail.com' },
        { icon: <Icons.Location />, label: 'Localización', value: 'Barcelona, España', href: null },
      ];

      return (
        <section id="contact" className="py-24 px-4 bg-gradient-to-b from-brand-50 to-white">
          <div className="max-w-6xl mx-auto">
            <div className="text-center mb-14">
              <span className="inline-block bg-brand-100 text-brand-700 rounded-full px-5 py-2 text-base font-bold uppercase tracking-widest mb-4">Contacto</span>
              <h2 className="font-display text-4xl sm:text-5xl font-bold text-brand-900 mb-4">Hablemos</h2>
              <div className="section-divider w-24 mx-auto mb-6"></div>
              <p className="text-xl text-gray-600 max-w-2xl mx-auto">
                ¿Tienes dudas, quieres solicitar una valoración o simplemente saludar? Estaré encantado de atenderte.
              </p>
            </div>

            <div className="max-w-xl mx-auto space-y-6">
              {info.map((item, i) => (
                <div key={i} className="flex items-center gap-5 bg-white border border-brand-100 rounded-2xl p-6 shadow-sm hover:shadow-md transition-shadow">
                  <div className="w-14 h-14 bg-brand-100 text-brand-600 rounded-xl flex items-center justify-center shrink-0">{item.icon}</div>
                  <div>
                    <p className="text-sm font-bold uppercase tracking-widest text-brand-400 mb-0.5">{item.label}</p>
                    {item.href ? <a href={item.href} className="text-xl font-semibold text-brand-800 hover:text-brand-600 underline underline-offset-2">{item.value}</a>
                      : <p className="text-xl font-semibold text-brand-800">{item.value}</p>}
                  </div>
                </div>
              ))}
              <div className="rounded-2xl overflow-hidden shadow-lg border border-brand-100 mt-8">
                <img src="assets/contacto_terapeuta.png" alt="Consulta de Terapia Ocupacional" className="w-full h-80 object-cover hover:scale-105 transition-transform duration-700" />
              </div>
            </div>
          </div>
        </section>
      );
    };

    // --- SECTION COOKIES ---
    window.SectionCookies = function SectionCookies() {
      return (
        <div className="min-h-screen pt-28 pb-20 px-4 bg-gray-50">
          <div className="max-w-4xl mx-auto bg-white p-8 sm:p-12 rounded-3xl border border-gray-100 shadow-sm">
            <h1 className="font-display text-4xl sm:text-5xl font-bold text-brand-900 mb-8">Política de Cookies y Privacidad</h1>
            <div className="space-y-6 text-gray-700 leading-relaxed text-lg">
              <p>
                En <strong>IAdapta</strong> utilizamos cookies propias y de terceros para mejorar la experiencia de usuario, analizar el tráfico web, y gestionar los enlaces de afiliación de Amazon. Al continuar navegando, consideramos que aceptas su uso.
              </p>

              <h2 className="text-2xl font-bold text-brand-800 mt-8 mb-4">1. ¿Qué son las cookies?</h2>
              <p>
                Las cookies son pequeños archivos de texto que los sitios web almacenan en tu dispositivo (ordenador, tablet, smartphone) cuando los visitas. Sirven para recordar tus preferencias, entender cómo interactúas con la web y personalizar el contenido.
              </p>

              <h2 className="text-2xl font-bold text-brand-800 mt-8 mb-4">2. Tipos de cookies que utilizamos</h2>
              <ul className="list-disc pl-6 space-y-2">
                <li><strong>Cookies Técnicas (Estrictamente necesarias):</strong> Permiten el funcionamiento básico de la web, como guardar tu preferencia de aceptación de cookies para no volver a preguntarte.</li>
                <li><strong>Cookies de Afiliación (Amazon Associates):</strong> Utilizamos enlaces de afiliados de Amazon. Cuando haces clic en uno de nuestros enlaces recomendados, Amazon instala una cookie en tu navegador durante 24 horas para atribuirnos una pequeña comisión si realizas una compra. Esto no supone ningún coste extra para ti.</li>
                <li><strong>Cookies de Funcionalidad y Análisis:</strong> Nos ayudan a comprender cómo interactúas con la web para mejorar continuamente el servicio y la interfaz.</li>
              </ul>

              <h2 className="text-2xl font-bold text-brand-800 mt-8 mb-4">3. Uso de Inteligencia Artificial (API Gemini)</h2>
              <p>
                Nuestra web cuenta con un <strong>Analizador IA de Accesibilidad</strong> impulsado por Gemini Vision. Al utilizar esta herramienta y subir una foto de tu entorno, la imagen se procesa temporalmente a través de una API para ofrecerte el análisis. <strong>No almacenamos tus imágenes en nuestros servidores ni las utilizamos para entrenar modelos de IA.</strong>
              </p>

              <h2 className="text-2xl font-bold text-brand-800 mt-8 mb-4">4. ¿Cómo puedes gestionar tus cookies?</h2>
              <p>
                Puedes permitir, bloquear o eliminar las cookies instaladas en tu equipo mediante la configuración de las opciones de tu navegador web. A continuación te ofrecemos enlaces a las guías de los navegadores más comunes:
              </p>
              <ul className="list-disc pl-6 space-y-2 text-brand-600">
                <li><a href="https://support.google.com/chrome/answer/95647?hl=es" target="_blank" rel="noopener noreferrer" className="hover:underline">Google Chrome</a></li>
                <li><a href="https://support.mozilla.org/es/kb/habilitar-y-deshabilitar-cookies-sitios-web-rastrear-preferencias" target="_blank" rel="noopener noreferrer" className="hover:underline">Mozilla Firefox</a></li>
                <li><a href="https://support.apple.com/es-es/guide/safari/sfri11471/mac" target="_blank" rel="noopener noreferrer" className="hover:underline">Safari</a></li>
                <li><a href="https://support.microsoft.com/es-es/windows/eliminar-y-administrar-cookies-168dab11-0753-043d-7c16-ede5947fc64d" target="_blank" rel="noopener noreferrer" className="hover:underline">Microsoft Edge</a></li>
              </ul>

              <h2 className="text-2xl font-bold text-brand-800 mt-8 mb-4">5. Actualización de la política</h2>
              <p>
                Es posible que actualicemos esta Política de Cookies en el futuro para adaptarla a cambios legislativos o nuevos servicios. Te recomendamos revisarla periódicamente.
              </p>

              <p className="mt-8 text-sm text-gray-500">Última actualización: Mayo 2026</p>
            </div>
          </div>
        </div>
      );
    };

    // --- FOOTER ---
    window.Footer = function Footer({ scrollTo, navigateTo }) {
      const year = new Date().getFullYear();
      return (
        <footer className="bg-brand-900 text-white pt-16 pb-8 px-4">
          <div className="max-w-6xl mx-auto">
            <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-10 mb-12">
              <div className="lg:col-span-2">
                <div className="mb-6 inline-block bg-accent-cream rounded-xl p-3 shadow-md">
                  <img src="assets/iadapta_logo.png" alt="IAdapta" className="h-14 object-contain" />
                </div>
                <p className="text-brand-200 text-lg leading-relaxed max-w-sm">
                  Especialista en geriatría y adaptación del entorno. Te acompaño hacia una vida más independiente y plena.
                </p>
              </div>
              <nav>
                <h3 className="text-base font-bold uppercase tracking-widest text-brand-300 mb-4">Navegación</h3>
                <ul className="space-y-3">
                  {[
                    { id: 'home', label: 'Inicio', isPage: false },
                    { id: 'cv', label: 'CV Interactivo', isPage: true },
                    { id: 'analyzer', label: 'Analizador IA', isPage: false },
                    { id: 'cognitive', label: 'Área Cognitiva', isPage: false },
                    { id: 'contact', label: 'Contacto', isPage: false },
                  ].map(l => (
                    <li key={l.id}>
                      <button onClick={() => l.isPage ? navigateTo(l.id) : (navigateTo('main'), setTimeout(() => scrollTo(l.id), 100))} className="text-brand-200 hover:text-white transition-colors text-lg">
                        {l.label}
                      </button>
                    </li>
                  ))}
                </ul>
              </nav>
              <div>
                <h3 className="text-base font-bold uppercase tracking-widest text-brand-300 mb-4">Enlaces</h3>
                <ul className="space-y-3">
                  <li><a href="https://www.linkedin.com/in/pablo-narciso-millan" target="_blank" rel="noopener noreferrer" className="text-brand-200 hover:text-white transition-colors text-lg">LinkedIn</a></li>
                  <li>
                    <button onClick={() => navigateTo('cookies')} className="text-brand-200 hover:text-white transition-colors text-lg">
                      Política de Cookies
                    </button>
                  </li>
                </ul>
              </div>
            </div>
            <div className="border-t border-brand-800 pt-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-brand-400 text-base">
              <p>© {year} IAdapta — Terapia Ocupacional & Accesibilidad.</p>
              <p className="flex items-center gap-2"><Icons.Heart /> Hecho con cuidado para mejorar la autonomía</p>
            </div>
          </div>
        </footer>
      );
    };

    // --- COOKIE BANNER ---
    window.CookieBanner = function CookieBanner({ navigateTo }) {
      const [isVisible, setIsVisible] = React.useState(false);

      React.useEffect(() => {
        const consent = localStorage.getItem('cookieConsent');
        if (!consent) {
          setIsVisible(true);
        }
      }, []);

      const handleAccept = () => {
        localStorage.setItem('cookieConsent', 'true');
        setIsVisible(false);
      };

      if (!isVisible) return null;

      return (
        <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.1)] p-4 sm:p-5 z-50 flex flex-col sm:flex-row items-center justify-center sm:justify-between gap-4">
          <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between w-full gap-4">
            <p className="text-gray-700 text-sm sm:text-base text-center sm:text-left leading-relaxed">
              Utilizamos cookies para mejorar tu experiencia y gestionar los enlaces de afiliados. Al navegar, aceptas su uso.{' '}
              <button
                onClick={() => navigateTo('cookies')}
                className="text-brand-600 font-bold underline hover:text-brand-800 transition-colors inline-block mt-1 sm:mt-0 cursor-pointer"
              >
                Política de Cookies
              </button>
            </p>
            <button
              onClick={handleAccept}
              className="shrink-0 bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 px-8 rounded-xl shadow-md transition-all focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 w-full sm:w-auto"
            >
              Aceptar
            </button>
          </div>
        </div>
      );
    };

    // --- APP ---
    function App() {
      const [currentPage, setCurrentPage] = useState('main'); // 'main', 'cv', 'cookies', 'memory', 'order'
      const [activeSection, setActiveSection] = useState('home');

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const pageParam = params.get('page');
        
        if (pageParam === 'memory') {
          setCurrentPage('cognitive');
        } else if (pageParam === 'order') {
          setCurrentPage('order');
        } else if (pageParam === 'analyzer') {
          setCurrentPage('analyzer');
        }

        if (currentPage !== 'main') return;
        const sections = ['home', 'analyzer', 'guides', 'cognitive', 'about', 'contact'];
        const onScroll = () => {
          const scrollY = window.scrollY + 120;
          let current = 'home';
          sections.forEach(id => {
            const el = document.getElementById(id);
            if (el && el.offsetTop <= scrollY) current = id;
          });
          setActiveSection(current);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, [currentPage]);

      const scrollTo = useCallback((id) => {
        setActiveSection(id);
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, []);

      const navigateTo = useCallback((page) => {
        setCurrentPage(page);
        window.scrollTo({ top: 0, behavior: 'instant' });
      }, []);

      const params = new URLSearchParams(window.location.search);
      const pageParam = params.get('page');
      const isStandalone = pageParam === 'memory' || pageParam === 'order' || pageParam === 'analyzer';

      return (
        <>
          {!isStandalone && <Navbar activeSection={activeSection} scrollTo={scrollTo} currentPage={currentPage} navigateTo={navigateTo} />}
          <main id="main-content">
            {currentPage === 'main' && (
              <>
                <SectionHome scrollTo={scrollTo} navigateTo={navigateTo} />
                <div className="max-w-4xl mx-auto px-4"><div className="section-divider my-0"></div></div>
                <SectionAnalyzer isTeaser={true} isStandalone={false} />
                <div className="max-w-4xl mx-auto px-4"><div className="section-divider my-0"></div></div>
                <SectionGuides />
                <div className="max-w-4xl mx-auto px-4"><div className="section-divider my-0"></div></div>
                <SectionCognitive isTeaser={true} navigateTo={navigateTo} />
                <div className="max-w-4xl mx-auto px-4"><div className="section-divider my-0"></div></div>
                <SectionAbout navigateTo={navigateTo} />
                <div className="max-w-4xl mx-auto px-4"><div className="section-divider my-0"></div></div>
                <SectionContact />
              </>
            )}
            {currentPage === 'cv' && (
              <SectionCV />
            )}
            {currentPage === 'cognitive' && (
              <SectionCognitive isTeaser={false} navigateTo={navigateTo} isStandalone={isStandalone} />
            )}
            {currentPage === 'order' && (
              <SectionOrderGame isStandalone={isStandalone} />
            )}
            {currentPage === 'analyzer' && (
              <SectionAnalyzer isTeaser={false} isStandalone={isStandalone} />
            )}
            {currentPage === 'cookies' && (
              <SectionCookies />
            )}
          </main>
          {!isStandalone && <Footer scrollTo={scrollTo} navigateTo={navigateTo} />}
          {!isStandalone && <CookieBanner navigateTo={navigateTo} />}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);


  </script>
</body>

</html>
