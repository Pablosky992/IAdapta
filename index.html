          badge: 'Accesibilidad',
          image: 'ramp_calculator_thumb_1778710368417.png'
        },
        {
          id: 'pao',
          title: 'Buscador PAO (CatSalut)',
          desc: 'Consulta códigos, importes y descripciones de prestaciones ortoprotéticas.',
          icon: <Icons.Search />,
          color: 'bg-blue-900 text-white',
          badge: 'Gestión',
          image: 'pao_finder_thumb_1778710383483.png'
        }
      ];

      const cte = getCTEStatus();

      return (
        <section id="resources" className="py-24 px-4 bg-brand-50/50 min-h-screen">
          <div className="max-w-6xl mx-auto">
            
            {view !== 'menu' && (
              <div className="flex justify-start mb-8">
                <button 
                  onClick={() => setView('menu')} 
                  className="inline-flex items-center gap-2 text-brand-600 font-bold hover:text-brand-800 transition-colors bg-white px-5 py-2.5 rounded-xl shadow-sm border border-brand-100 group"
                >
                  <Icons.ArrowLeft className="w-5 h-5 group-hover:-translate-x-1 transition-transform" />
                  <span>Volver a Recursos</span>
                </button>
              </div>
            )}

            <div className="text-center mb-16">
              <span className="inline-block bg-brand-100 text-brand-700 rounded-full px-5 py-2 text-base font-bold uppercase tracking-widest mb-4">Área del Profesional</span>
              <h2 className="font-display text-4xl sm:text-5xl font-bold text-brand-900 mb-6">Recursos para Profesionales</h2>
              <div className="section-divider w-24 mx-auto mb-8"></div>
              
              {view === 'menu' && !isPWA && (
                <div className="mb-12">
                  <button 
                    onClick={() => {
                      if (window.deferredPrompt) {
                        window.deferredPrompt.prompt();
                        window.deferredPrompt.userChoice.then((choiceResult) => {
                          if (choiceResult.outcome === 'accepted') {
                            console.log('User accepted the Pro install prompt');
                          }
                          window.deferredPrompt = null;
                          window.dispatchEvent(new CustomEvent('pwa-installed'));
                        });
                      } else {
                        const isProContext = new URLSearchParams(window.location.search).get('page') === 'resources';
                        if (isProContext) {
                          alert("Para instalar IAdapta Recursos: \n1. Pulsa el botón de 'Compartir' (en iOS) o el menú de tres puntos (en Android). \n2. Selecciona 'Añadir a pantalla de inicio' o 'Instalar aplicación'.");
                        } else {
                          // Navigate and tell the app to auto-trigger install prompt once ready
                          const baseUrl = window.location.href.split('?')[0];
                          window.location.href = `${baseUrl}?page=resources&autoInstall=true`;
                        }
                      }
                    }}
                    className="inline-flex items-center gap-3 px-8 py-4 bg-brand-900 text-white rounded-2xl font-bold text-xl hover:bg-brand-800 transition-all shadow-xl shadow-brand-900/20 hover:scale-105 active:scale-95 group"
                  >
                    <div className="bg-white/10 p-2 rounded-xl">
                      <Icons.Download />
                    </div>
                    <span>{window.deferredPrompt ? 'Instalar App de Recursos' : 'Descargar App de Recursos'}</span>
                    <Icons.Briefcase className="w-6 h-6" />
                  </button>
                </div>
              )}
            </div>

            {view === 'menu' ? (
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-8 anim-fade-in">
                {tools.map(tool => (
                  <div 
                    key={tool.id}
                    onClick={() => setView(tool.id)}
                    className="bg-white rounded-[2.5rem] overflow-hidden border border-brand-100 shadow-xl hover:shadow-2xl transition-all cursor-pointer group flex flex-col"
                  >
                    <div className="h-48 overflow-hidden relative">
                      <img src={tool.image} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" alt={tool.title} />
                      <div className="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
                      <div className={`absolute top-4 right-4 w-12 h-12 ${tool.color} rounded-xl flex items-center justify-center shadow-lg group-hover:rotate-6 transition-transform`}>
                        {tool.icon}
                      </div>
                    </div>
                    <div className="p-8 flex flex-col items-center text-center flex-1">
                      <span className="text-brand-400 font-bold uppercase tracking-widest text-[10px] mb-3">{tool.badge}</span>
                      <h3 className="font-display text-xl font-bold text-brand-900 mb-4">{tool.title}</h3>
                      <p className="text-gray-500 text-sm leading-relaxed mb-8 flex-1">{tool.desc}</p>
                      <div className="inline-flex items-center gap-2 text-brand-600 font-bold group-hover:gap-3 transition-all text-sm">
                        Abrir herramienta
                        <Icons.ArrowRight />
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            ) : view === 'math' ? (
              <div className="anim-scale-in">
                {/* TOOL 1: Math PDF Generator */}
                <div className="bg-white rounded-[3rem] overflow-hidden shadow-2xl border border-brand-100 flex flex-col lg:flex-row mb-16">
                  <div className="flex-1 p-8 sm:p-12 lg:p-16">
                    <div className="flex items-center gap-4 mb-8">
                      <div className="w-14 h-14 bg-brand-900 text-white rounded-2xl flex items-center justify-center shadow-lg">
                        <Icons.FilePdf />
                      </div>
                      <div>
                        <h3 className="font-display text-3xl font-bold text-brand-900">Generador de Fichas</h3>
                        <p className="text-brand-500 font-bold uppercase tracking-widest text-xs">Cálculo Matemático</p>
                      </div>
                    </div>

                    <p className="text-gray-600 text-lg mb-10 leading-relaxed">
                      Selecciona el tipo de actividad y la dificultad para generar un PDF personalizado listo para imprimir.
                    </p>

                    <div className="space-y-6 mb-10">
                      <p className="font-bold text-brand-900 text-sm uppercase tracking-wider">Tipo de ficha</p>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        {[
                          { id: 'math', label: 'Cálculo', icon: <Icons.Calculator className="w-4 h-4" /> },
                          { id: 'wordsearch', label: 'Sopa Letras', icon: <Icons.Search className="w-4 h-4" /> },
                          { id: 'visual', label: 'Agudeza', icon: <Icons.Brain className="w-4 h-4" /> }
                        ].map(type => (
                          <button
                            key={type.id}
                            onClick={() => setSheetType(type.id)}
                            className={`py-3 px-4 rounded-xl font-bold transition-all flex items-center justify-center gap-2 border-2 ${sheetType === type.id 
                              ? 'bg-brand-50 border-brand-900 text-brand-900' 
                              : 'bg-white border-gray-100 text-gray-400 hover:border-brand-200'}`}
                          >
                            {type.icon}
                            {type.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-6 mb-12">
                      <p className="font-bold text-brand-900 text-sm uppercase tracking-wider">Nivel de dificultad</p>
                      <div className="grid grid-cols-3 gap-3">
                        {[
                          { id: 'easy', label: 'Básica' },
                          { id: 'medium', label: 'Media' },
                          { id: 'hard', label: 'Alta' }
                        ].map(level => (
                          <button
                            key={level.id}
                            onClick={() => setDifficulty(level.id)}
                            className={`py-4 rounded-2xl font-bold transition-all border-2 ${difficulty === level.id 
                              ? 'bg-brand-900 text-white border-brand-900 shadow-lg scale-105' 
                              : 'bg-white text-gray-400 border-gray-100 hover:border-brand-200 hover:text-brand-600'}`}
                          >
                            {level.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <button
                      onClick={handleMainAction}
                      disabled={isGenerating}
                      className="w-full py-5 bg-brand-900 text-white rounded-2xl font-bold text-xl hover:bg-opacity-90 transition-all flex items-center justify-center gap-3 shadow-xl shadow-brand-900/20 disabled:opacity-50 group"
                    >
                      {isGenerating ? (
                        <div className="w-6 h-6 border-3 border-white/30 border-t-white rounded-full animate-spin"></div>
                      ) : (
                        <>
                          <Icons.Download />
                          Descargar Ficha PDF
                        </>
                      )}
                    </button>
                  </div>

                  <div className="lg:w-[45%] bg-brand-900 relative min-h-[400px] flex flex-col justify-end p-8 sm:p-12 lg:p-16 overflow-hidden">
                    <img src="resources_bg.png" className="absolute inset-0 w-full h-full object-cover opacity-30 mix-blend-overlay" alt="" />
                    <div className="absolute inset-0 bg-gradient-to-t from-brand-900 via-brand-900/40 to-transparent"></div>
                    <div className="relative z-10">
                      <h4 className="text-2xl font-bold text-white mb-8 flex items-center gap-3">
                        <Icons.Lightbulb />
                        Ventajas Clínicas
                      </h4>
                      <ul className="space-y-4 mb-10">
                        {[
                          'Material ilimitado y aleatorio.',
                          'Ahorro crítico de tiempo administrativo.',
                          'Adaptación al deterioro cognitivo.'
                        ].map((item, i) => (
                          <li key={i} className="flex items-center gap-3 text-brand-100 font-medium">
                            <div className="w-6 h-6 bg-accent-coral/20 text-accent-coral rounded-full flex items-center justify-center shrink-0">
                              <Icons.Check />
                            </div>
                            {item}
                          </li>
                        ))}
                      </ul>
                      <div className="p-6 bg-white/5 rounded-2xl border border-white/10 backdrop-blur-sm">
                        <p className="text-brand-200 italic text-lg leading-relaxed">
                          "Automatizar el material de apoyo nos permite centrar toda nuestra energía en el paciente."
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            ) : view === 'ramp' ? (
              <div className="anim-scale-in max-w-5xl mx-auto">
                <div className="bg-white rounded-[3rem] shadow-2xl border border-brand-100 overflow-hidden">
                  <div className="p-8 sm:p-12">
                    <div className="flex items-center gap-4 mb-10">
                      <div className="w-14 h-14 bg-emerald-600 text-white rounded-2xl flex items-center justify-center shadow-lg">
                        <Icons.TrendingUp />
                      </div>
                      <div>
                        <h3 className="font-display text-3xl font-bold text-brand-900">Calculadora de Rampas</h3>
                        <p className="text-emerald-600 font-bold uppercase tracking-widest text-xs">Cumplimiento CTE España</p>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                      <div className="space-y-8">
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                          <div className="space-y-2">
                            <label className="text-sm font-bold text-brand-900 uppercase tracking-wider">Altura (cm)</label>
                            <input 
                              type="text" 
                              value={rampHeight}
                              onChange={(e) => handleRampChange('h', e.target.value)}
                              className={`w-full p-4 rounded-2xl border-2 transition-all text-xl font-bold ${!cte.valid ? 'border-red-100 bg-red-50 text-red-600 focus:border-red-500' : 'border-brand-50 focus:border-emerald-500 bg-brand-50/30'}`}
                              placeholder="Ej: 15"
                            />
                          </div>
                          <div className="space-y-2">
                            <label className="text-sm font-bold text-brand-900 uppercase tracking-wider">Longitud (cm)</label>
                            <input 
                              type="text" 
                              value={rampLength}
                              onChange={(e) => handleRampChange('l', e.target.value)}
                              className={`w-full p-4 rounded-2xl border-2 transition-all text-xl font-bold ${!cte.valid ? 'border-red-100 bg-red-50 text-red-600 focus:border-red-500' : 'border-brand-50 focus:border-emerald-500 bg-brand-50/30'}`}
                              placeholder="Ej: 250"
                            />
                          </div>
                          <div className="space-y-2">
                            <label className="text-sm font-bold text-brand-900 uppercase tracking-wider">Pendiente (%)</label>
                            <input 
                              type="text" 
                              value={rampSlope}
                              onChange={(e) => handleRampChange('s', e.target.value)}
                              className={`w-full p-4 rounded-2xl border-2 transition-all text-xl font-bold ${!cte.valid ? 'border-red-100 bg-red-50 text-red-600 focus:border-red-500' : 'border-brand-50 focus:border-emerald-500 bg-brand-50/30'}`}
                              placeholder="Ej: 8"
                            />
                          </div>
                        </div>

                        <div className={`p-6 rounded-3xl border-2 transition-all flex items-start gap-4 ${cte.valid ? 'bg-emerald-50 border-emerald-100 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'}`}>
                          <div className={`p-2 rounded-xl ${cte.valid ? 'bg-emerald-200 text-emerald-700' : 'bg-red-200 text-red-700'}`}>
                            {cte.valid ? <Icons.Check /> : <Icons.AlertCircle />}
                          </div>
                          <div>
                            <p className="font-bold text-lg">{cte.valid ? 'Cálculo Correcto' : 'Incumple Normativa'}</p>
                            <p className="opacity-80">{cte.msg || 'Introduce dos valores para calcular el tercero.'}</p>
                          </div>
                        </div>

                        <button 
                          onClick={() => { setRampHeight(''); setRampLength(''); setRampSlope(''); }}
                          className="w-full py-4 rounded-2xl border-2 border-gray-100 text-gray-400 font-bold hover:bg-gray-50 transition-all flex items-center justify-center gap-2"
                        >
                          <Icons.Refresh /> Limpiar valores
                        </button>
                      </div>

                      <div className="bg-brand-50/50 rounded-[2rem] p-8 flex flex-col items-center justify-center min-h-[300px] border border-brand-100">
                        <svg viewBox="0 0 400 200" className="w-full h-auto drop-shadow-xl">
                          {/* Suelo */}
                          <line x1="20" y1="180" x2="380" y2="180" stroke="#1a3052" strokeWidth="4" strokeLinecap="round" />
                          
                          {/* Rampa */}
                          {parseFloat(rampHeight) > 0 && parseFloat(rampLength) > 0 ? (
                            <>
                              <path 
                                d={`M 50 180 L 350 180 L 350 ${180 - Math.min(100, (parseFloat(rampHeight) * 2))} Z`} 
                                fill={cte.valid ? '#10b981' : '#ef4444'} 
                                fillOpacity="0.2"
                                stroke={cte.valid ? '#10b981' : '#ef4444'}
                                strokeWidth="4"
                                strokeLinejoin="round"
                                className="transition-all duration-500"
                              />
                              <text x="200" y="195" textAnchor="middle" className="text-[10px] font-bold fill-brand-900">{rampLength}cm</text>
                              <text x="360" y={180 - Math.min(50, (parseFloat(rampHeight)))} textAnchor="start" className="text-[10px] font-bold fill-brand-900">{rampHeight}cm</text>
                              <text x="200" y={170 - Math.min(50, (parseFloat(rampHeight)))} textAnchor="middle" className={`text-xs font-black ${cte.valid ? 'fill-emerald-600' : 'fill-red-600'}`}>{rampSlope}%</text>
                            </>
                          ) : (
                            <text x="200" y="100" textAnchor="middle" className="fill-brand-200 font-bold italic">Esperando datos...</text>
                          )}
                        </svg>
                      </div>
                    </div>
                  </div>
                  <div className="bg-brand-900 p-8 text-white">
                    <div className="max-w-3xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
                      <div className="flex items-center gap-4">
                        <div className="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center">
                          <Icons.Lightbulb className="text-emerald-400" />
                        </div>
                        <p className="text-sm font-medium text-brand-100">
                          <strong>Norma CTE DB-SUA:</strong> Pendiente máx. 10% (L&lt;300cm), 8% (L&lt;600cm), 6% (Resto).
                        </p>
                      </div>
                      <div className="text-xs text-brand-300 font-mono bg-black/20 px-4 py-2 rounded-lg border border-white/5">
                        Fórmula: (H / L) * 100
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            ) : (
              <div className="anim-scale-in">
                {/* TOOL 3: CatSalut Code Finder */}
                <div className="bg-white rounded-[3rem] p-8 sm:p-12 shadow-xl border border-brand-50">
                  <div className="flex items-center gap-4 mb-8">
                    <div className="w-14 h-14 bg-blue-900 text-white rounded-2xl flex items-center justify-center shadow-lg">
                      <Icons.Search />
                    </div>
                    <div>
                      <h3 className="font-display text-3xl font-bold text-brand-900">Buscador PAO (CatSalut)</h3>
                      <p className="text-blue-500 font-bold uppercase tracking-widest text-xs">Prestacions Ortoprotètiques</p>
                    </div>
                  </div>
                  
                  <div className="relative mb-12">
                    <div className="absolute inset-y-0 left-6 flex items-center pointer-events-none text-blue-500">
                      <Icons.Search />
                    </div>
                    <input 
                      type="text" 
                      placeholder="Ej: silla de ruedas, andador, EPL 050..."
                      className="w-full pl-16 pr-8 py-6 bg-white border-2 border-brand-100 rounded-[2rem] focus:ring-8 focus:ring-blue-500/10 focus:border-blue-500 transition-all text-xl shadow-sm placeholder:text-gray-400"
                      value={searchTerm}
                      onChange={(e) => handleSearch(e.target.value)}
                    />
                  </div>

                  {searchResults.length > 0 ? (
                    <div className="max-h-[600px] overflow-y-auto custom-scrollbar">
                      {/* Vista Sobremesa: Tabla */}
                      <div className="hidden md:block overflow-x-auto rounded-[2rem] border border-gray-100 shadow-inner bg-gray-50/30">
                        <table className="w-full text-left border-collapse">
                          <thead className="sticky top-0 z-10">
                            <tr className="bg-brand-900 text-white">
                              <th className="p-5 font-display text-sm uppercase tracking-widest">Código PAO</th>
                              <th className="p-5 font-display text-sm uppercase tracking-widest">Producto / Descripción</th>
                              <th className="p-5 font-display text-sm uppercase tracking-widest text-right">Importe</th>
                              <th className="p-5 font-display text-sm uppercase tracking-widest text-center">Detalles</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-gray-100 bg-white">
                            {searchResults.map((item, i) => (
                              <tr key={i} className="hover:bg-blue-50/50 transition-colors group/row">
                                <td className="p-5 align-top">
                                  <div className="bg-brand-50 border border-brand-100 rounded-2xl p-4 text-center group-hover/row:bg-white transition-colors shadow-sm">
                                    <span className="font-mono text-xl font-black text-brand-900 tracking-tight block">
                                      {item.sC} {item.tC}
                                    </span>
                                  </div>
                                </td>
                                <td className="p-5">
                                  <p className="font-bold text-brand-900 text-lg mb-1">{item.tD}</p>
                                  <p className="text-xs text-brand-500 font-medium uppercase tracking-wider">{item.cD}</p>
                                </td>
                                <td className="p-5 text-right whitespace-nowrap">
                                  <p className="font-black text-emerald-600 text-xl">{item.p}€</p>
                                  <p className="text-xs text-gray-500 font-bold uppercase tracking-wide">Aportación: {item.u}€</p>
                                </td>
                                <td className="p-5 text-center align-middle">
                                   <div className="group inline-block relative">
                                     <button className="w-12 h-12 bg-gray-50 border-2 border-gray-100 rounded-2xl flex items-center justify-center text-brand-600 hover:bg-brand-900 hover:text-white transition-all shadow-sm">
                                       <Icons.Search />
                                     </button>
                                     <div className="absolute bottom-full right-0 mb-4 w-72 p-6 bg-brand-900 text-white rounded-[2rem] shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible group-focus-within:opacity-100 group-focus-within:visible transition-all z-20 pointer-events-none border border-white/10">
                                        <div className="space-y-5">
                                          <div className="flex justify-between items-center border-b border-white/10 pb-3">
                                            <span className="text-[10px] text-brand-300 uppercase font-bold tracking-widest">Validación Sanitaria</span>
                                            <span className="text-sm font-black text-blue-400">{item.v === 'S' ? 'Sí' : 'No'}</span>
                                          </div>
                                          <div className="flex justify-between items-center">
                                            <span className="text-[10px] text-brand-300 uppercase font-bold tracking-widest">Periodicidad</span>
                                            <span className="text-sm font-black text-blue-400">{item.m} meses</span>
                                          </div>
                                        </div>
                                        <div className="absolute top-full right-6 w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-t-[10px] border-t-brand-900"></div>
                                     </div>
                                   </div>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>

                      {/* Vista Móvil: Tarjetas */}
                      <div className="md:hidden space-y-5">
                        {searchResults.map((item, i) => (
                          <div key={i} className="bg-white rounded-3xl border border-brand-100 p-7 shadow-md">
                            <div className="flex justify-between items-start mb-5">
                              <div className="bg-brand-900 text-white px-5 py-2.5 rounded-xl font-mono font-bold text-xl">
                                {item.sC} {item.tC}
                              </div>
                              <div className="text-right">
                                <p className="font-black text-emerald-600 text-2xl">{item.p}€</p>
                                <p className="text-xs text-gray-500 font-bold uppercase">Usuario: {item.u}€</p>
                              </div>
                            </div>
                            <h4 className="font-bold text-brand-900 text-xl mb-2 leading-tight">{item.tD}</h4>
                            <p className="text-sm text-brand-500 uppercase tracking-wide mb-6 font-medium">{item.cD}</p>
                            
                            <div className="grid grid-cols-2 gap-4 pt-5 border-t border-brand-50">
                              <div className="bg-brand-50 p-4 rounded-2xl">
                                <span className="block text-[11px] text-brand-400 uppercase font-bold mb-1 tracking-wider">Validación Sanitaria</span>
                                <span className="font-bold text-brand-800 text-sm">{item.v === 'S' ? 'Necesaria' : 'No requiere'}</span>
                              </div>
                              <div className="bg-brand-50 p-4 rounded-2xl">
                                <span className="block text-[11px] text-brand-400 uppercase font-bold mb-1 tracking-wider">Periodicidad Mín.</span>
                                <span className="font-bold text-brand-800 text-sm">{item.m} meses</span>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  ) : searchTerm.length >= 4 ? (
                    <div className="text-center py-20 bg-gray-50 rounded-[2rem] border-2 border-dashed border-gray-200">
                      <div className="text-5xl mb-4">🔍</div>
                      <p className="text-xl text-gray-500">No se han encontrado resultados para "{searchTerm}"</p>
                    </div>
                  ) : (
                    <div className="text-center py-20 bg-blue-50/30 rounded-[2rem] border border-blue-100">
                      <div className="text-5xl mb-4 text-blue-200">⌨️</div>
                      <p className="text-xl text-blue-900/60 font-medium">Escribe al menos 4 caracteres para buscar</p>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        </section>
      );
    };

    const Navbar = function Navbar({ activeSection, scrollTo, currentPage, navigateTo }) {
      const [menuOpen, setMenuOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 30);
        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const linksMain = [
        { id: 'home', label: 'Inicio' },
        { id: 'analyzer', label: 'Analizador IA' },
        { id: 'guides', label: 'Guías de adaptación' },
        { id: 'cognitive', label: 'Área Cognitiva' },
        { id: 'resources', label: 'Recursos para profesionales' },
        { id: 'about', label: 'Sobre Mí' },
        { id: 'contact', label: 'Contacto' },

    const SectionAnalyzer = function SectionAnalyzer({ isTeaser, isStandalone, navigateTo }) {
      const { useState, useEffect, useRef } = React;
      const [step, setStep] = useState('form');
      const [score, setScore] = useState(0);
      const [ringOffset, setRingOffset] = useState(283);
      const [form, setForm] = useState({ tipo: '', ascensor: '', anchoAscensor: '', largoAscensor: '', tipoBanyo: '', barras: '', alzaWC: '', iluminacion: '', puertas: '', movilidad: '', nivelMovilidad: '', capacidadesMotoras: '', notas: '' });

      // New States for AI Image Analysis
      const [file, setFile] = useState(null);
      const [preview, setPreview] = useState(null);
      const [base64, setBase64] = useState(null);
      const [aiResponse, setAiResponse] = useState('');
      const [isDragging, setIsDragging] = useState(false);
      const [aiError, setAiError] = useState('');
      const [savedReports, setSavedReports] = useState([]);

      const resultRef = useRef(null);

      // Cargar historial al inicio
      useEffect(() => {
        const localData = localStorage.getItem('iadapta_reports');
        if (localData) {
          try { setSavedReports(JSON.parse(localData)); } catch (e) {}
        }
      }, []);

      // Guardar informe en el historial
      const saveToHistory = (dataText, sc) => {
        const newReport = {
          id: Date.now(),
          date: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
          score: sc,
          aiResponse: dataText,
          form: { ...form }
        };
        const updated = [newReport, ...savedReports].slice(0, 10);
        setSavedReports(updated);
        localStorage.setItem('iadapta_reports', JSON.stringify(updated));
      };

      // Auto-guardado de borrador
      useEffect(() => {
        const draft = localStorage.getItem('iadapta_draft');
        if (draft) {
          try { setForm(JSON.parse(draft)); } catch(e) {}
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('iadapta_draft', JSON.stringify(form));
      }, [form]);

      const loadFromHistory = (report) => {
        setForm(report.form);
        setAiResponse(report.aiResponse);
        setScore(report.score);
        setStep('results');
        setTimeout(() => setRingOffset(283 - (283 * report.score / 100)), 100);
      };

      const deleteFromHistory = (e, id) => {
        e.stopPropagation();
        const updated = savedReports.filter(r => r.id !== id);
        setSavedReports(updated);
        localStorage.setItem('iadapta_reports', JSON.stringify(updated));
      };

      const handleChange = (e) => setForm(f => ({ ...f, [e.target.name]: e.target.value }));

      const handleDragOver = (e) => { e.preventDefault(); setIsDragging(true); };
      const handleDragLeave = (e) => { e.preventDefault(); setIsDragging(false); };
      const handleDrop = (e) => {
        e.preventDefault(); setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFile(e.dataTransfer.files[0]);
        }
      };
      const handleFileSelect = (e) => {
        if (e.target.files && e.target.files[0]) {
          handleFile(e.target.files[0]);
        }
      };

      const handleFile = (selectedFile) => {
        setFile(selectedFile);
        setPreview(URL.createObjectURL(selectedFile));
        
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64Str = reader.result;
          
          // Compresión inmediata al cargar
          const img = new Image();
          img.src = base64Str;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const MAX_SIZE = 800;
            if (width > height) {
              if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
            } else {
              if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const optimized = canvas.toDataURL('image/jpeg', 0.6); // 60% calidad para ligereza total
            setBase64(optimized.split(',')[1]);
          };
        };
        reader.readAsDataURL(selectedFile);
      };

      const removeFile = () => {
        setFile(null); setPreview(null); setBase64(null);
      };

      const calcScore = () => {
        let pts = 60;
        if (form.tipoBanyo === 'ducha') pts += 10;
        if (form.iluminacion === 'buena') pts += 10; else if (form.iluminacion === 'media') pts += 5;
        if (form.puertas === 'ancha') pts += 10; else if (form.puertas === 'estandar') pts += 5;

        if (form.ascensor === 'no') pts -= 10;
        if (form.anchoAscensor === 'estrecha' || form.puertas === 'estrecha') pts -= 15;

        if (form.nivelMovilidad === 'asistencia' || form.nivelMovilidad === 'encamado') pts -= 15;
        if (form.destrezaManos === 'temblor' || form.destrezaManos === 'no-funcional') pts -= 5;
        if (form.caidas === 'si') pts -= 15;
        if (form.percepcionSeguridad && parseInt(form.percepcionSeguridad) < 5) pts -= 10;

        return Math.max(0, Math.min(pts, 100));
      };

      const getRecommendations = (sc) => {
        const all = [];

        // Lógica de Espacios Críticos
        if (form.puertas === 'estrecha' || (form.ascensor === 'si' && form.anchoAscensor === 'estrecha')) {
          all.push({
            cond: true, icon: '⚠️', prio: 'Alta',
            text: 'AVISO DE ACCESIBILIDAD PRIORITARIO: Tus pasos de puerta o el acceso al ascensor son reducidos (≤ 60 cm). Antes de comprar cualquier silla o andador, asegúrate de que el ancho total del producto no supere los 55 cm para garantizar un paso seguro y sin colisiones.',
          });
        }

        if (form.caidas === 'si') {
          const fear = parseInt(form.percepcionSeguridad) || 5;
          let mobilityAdvice = '';
          let link = { text: 'Ver ayudas a la marcha', url: 'https://amzn.to/4nioy6O' };
          
          if (fear <= 3) {
            mobilityAdvice = ' Dada la frecuencia de caídas y tu baja seguridad, es fundamental valorar el uso de un andador (rollator) que proporcione una base de apoyo estable.';
            link = { text: 'Ver andadores recomendados', url: 'https://amzn.to/4nioy6O' };
          } else {
            mobilityAdvice = ' Debido a los tropiezos recientes, el uso de unas muletas ergonómicas con apoyo de antebrazo te proporcionará el apoyo extra necesario sin sobrecargar tus muñecas.';
            link = { text: 'Ver muletas ergonómicas', url: 'https://amzn.to/4dE2H6n' };
          }

          all.push({
            cond: true, icon: '🚨', prio: 'Alta',
            text: `ALERTA DE SEGURIDAD: Al haber sufrido caídas recientemente, el riesgo de recidiva es muy alto. Es URGENTE eliminar alfombras y mejorar la iluminación.${mobilityAdvice}`,
            linkText: link.text, linkUrl: link.url
          });
        }

        if (form.percepcionSeguridad && parseInt(form.percepcionSeguridad) < 5) {
          all.push({
            cond: true, icon: '😟', prio: 'Media',
            text: 'ATENCIÓN MULTIDISCIPLINAR: Una baja percepción de seguridad (miedo a caer) provoca una reducción de la actividad que debilita los músculos y aumenta el riesgo real de caída. Te recomendamos consultar con un equipo de profesionales (Terapeuta Ocupacional, Fisioterapeuta y Psicólogo) para realizar un entrenamiento integral de equilibrio, fuerza y gestión del miedo.',
          });
        }

        if (form.convivencia === 'solo' && form.caidas === 'si') {
          all.push({
            cond: true, icon: '🏠', prio: 'Alta',
            text: 'SEGURIDAD DOMICILIARIA: Al vivir solo y haber tenido caídas, es IMPRESCINDIBLE contar con un sistema de teleasistencia o un dispositivo de detección de caídas. Esto garantiza que, en caso de incidente, el aviso a los servicios de emergencia o familiares sea automático e inmediato.',
          });
        }

        if (form.limitacionPrincipal === 'fatiga') {
          all.push({
            cond: true, icon: '🫁', prio: 'Media',
            text: 'GESTIÓN DE LA ENERGÍA: Al identificar la fatiga como limitación principal, es vital aplicar técnicas de simplificación de tareas. Realiza las actividades sentado (higiene, cocina) y planifica periodos de descanso breves pero frecuentes para evitar el agotamiento que aumenta el riesgo de caídas.',
          });
        }

        if (form.ascensor === 'no') {
          all.push({
            cond: true, icon: '🏢', prio: 'Alta',
            text: 'Al no disponer de ascensor, la accesibilidad exterior es crítica. Te recomendamos valorar con la comunidad de vecinos o propietarios la instalación de soluciones como un ascensor, salvaescaleras o rampas normativas para garantizar una entrada y salida del hogar segura y sin barreras.',
          });
        }

        // Lógica de Baño
        if (form.tipoBanyo === 'banera') {
          all.push({
            cond: true, icon: '🚿', prio: 'Alta',
            text: 'Al disponer de bañera, el riesgo de caída al intentar salvar el borde es elevado. Te recomendamos el uso de una Tabla de Bañera. Este dispositivo permite realizar la entrada y salida sentado, eliminando la necesidad de mantener el equilibrio a una sola pierna mientras se supera el obstáculo.',
            linkText: 'Ver tabla de bañera recomendada', linkUrl: 'https://amzn.to/4uLnkU5'
          });
        } else if (form.tipoBanyo === 'ducha') {
          all.push({
            cond: true, icon: '🚿', prio: 'Media',
            text: 'Contar con ducha es un gran paso, pero para una higiene segura y sin fatiga, es fundamental realizarla en sedestación. Un asiento o banqueta de ducha te proporcionará la estabilidad necesaria y evitará resbalones por cansancio durante el aseo.',
            linkText: 'Ver asiento de ducha', linkUrl: 'https://amzn.to/4dfjkUJ'
          });
        }

        // Otras recomendaciones (mantenidas y adaptadas)
        if (form.iluminacion !== 'buena' && form.iluminacion !== '') {
          all.push({
            cond: true, icon: '💡', prio: 'Media',
            text: 'Consejo Técnico: Una iluminación deficiente es precursora de tropiezos. Instala luces automáticas con sensor de movimiento cerca del suelo en los trayectos nocturnos para asegurar una visibilidad clara sin necesidad de buscar interruptores.'
          });
        }

        if (form.movilidad === 'baston' || form.movilidad === 'andador') {
          all.push({
            cond: true, icon: '🦯', prio: 'Alta',
            text: 'Seguridad en la Marcha: Es vital retirar todas las alfombras y obstáculos. Verifica que las conteras de tu ayuda técnica no estén gastadas; sustituirlas por modelos antideslizantes de base ancha mejorará drásticamente tu estabilidad.',
            linkText: 'Ver conteras antideslizantes', linkUrl: 'https://amzn.to/4uw9fth'
          });
        }

        if (form.destrezaManos === 'fina' || form.destrezaManos === 'fuerza' || form.destrezaManos === 'temblor') {
          all.push({
            cond: true, icon: '🍴', prio: 'Media',
            text: 'AUTONOMÍA EN ALIMENTACIÓN: Al detectar dificultades en la destreza manual, el uso de cubiertos con mango engrosado y platos con reborde facilitará tu independencia durante las comidas, reduciendo el esfuerzo y la frustración.',
            linkText: 'Ver cubiertos adaptados', linkUrl: 'https://amzn.to/4wi1BVq'
          });
        }

        return all;
      };

      const getPositiveFindings = () => {
        const positives = [];
        if (form.tipoBanyo === 'ducha') positives.push({ icon: '✅', text: 'Dispones de plato de ducha, lo que facilita enormemente el acceso y reduce el riesgo de tropiezos comparado con una bañera.' });
        if (form.iluminacion === 'buena') positives.push({ icon: '✅', text: 'La buena iluminación detectada es fundamental para la seguridad visual y la prevención de caídas.' });
        if (form.puertas === 'ancha') positives.push({ icon: '✅', text: 'Tus puertas anchas garantizan un paso fluido y son compatibles con la mayoría de ayudas técnicas.' });
        if (form.nivelMovilidad === 'independiente') positives.push({ icon: '✅', text: 'Tu nivel de independencia actual es un gran activo; las adaptaciones ayudarán a preservarlo por más tiempo.' });
        return positives;
      };

      const isQuestionnaireComplete = () => {
        const requiredFields = ['nombre', 'edad', 'tipo', 'ascensor', 'tipoBanyo', 'iluminacion', 'puertas', 'movilidad', 'nivelMovilidad', 'destrezaManos', 'caidas', 'percepcionSeguridad', 'convivencia', 'limitacionPrincipal'];
        return requiredFields.every(field => form[field] !== '');
      };

      const prioBadge = { Alta: 'bg-red-100 text-red-700', Media: 'bg-amber-100 text-amber-700', Info: 'bg-brand-100 text-brand-700' };

      const handleAnalyze = async (e) => {
        e.preventDefault();
        
        if (!isQuestionnaireComplete()) {
          setAiError("Por favor, completa todas las preguntas del cuestionario antes de realizar el análisis por IA.");
          return;
        }

        setStep('loading');
        setAiError('');
        setAiResponse('');

// Se ha eliminado la función redundante resizeImage aquí porque ahora se hace en handleFile

        if (base64) {
          try {
            const response = await fetch('/api/analyze?t=' + Date.now(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                base64: base64,
                mimeType: 'image/jpeg',
                answers: form
              })
            });

            const textResponse = await response.text();
            let data;
            try {
              data = JSON.parse(textResponse);
            } catch (jsonErr) {
              console.error("Error al parsear JSON:", textResponse);
              throw new Error("El servidor no respondió en formato JSON. Respuesta técnica: " + textResponse.substring(0, 150));
            }

            if (data.error) throw new Error(data.error);

            if (data.text) {
              // Formateamos títulos ## y ### a h3 estilizados (limpieza total de símbolos)
              let formatted = data.text.replace(/^[#]{2,3}\s?(.*?)$/gm, '<h3 class="text-xl font-bold text-indigo-900 mt-6 mb-3 border-b border-indigo-100 pb-2">$1</h3>');
              // Formateamos negritas (Markdown ** a <strong>)
              formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
              // Convertimos listas de asteriscos (* ) en puntos tipográficos (•)
              formatted = formatted.replace(/^\*\s/gm, '• ');
              
              // Destacamos el aviso legal inicial
              const disclaimerText = "Este análisis ha sido generado mediante Inteligencia Artificial (modelo Gemini 2.0 Flash) en fase de pruebas. La información proporcionada es orientativa y puede contener errores. Debe ser validada por un profesional cualificado antes de realizar cualquier cambio estructural.";
              if (formatted.includes(disclaimerText)) {
                formatted = formatted.replace(disclaimerText, `<div class="bg-amber-50 border-l-4 border-amber-400 p-4 mb-6 text-amber-800 italic text-base leading-relaxed">${disclaimerText}</div>`);
              }
              
              setAiResponse(formatted);
              setStep('results');
              saveToHistory(formatted, calcScore()); // Guardamos automáticamente
            } else {
              throw new Error('No se pudo generar una respuesta.');
            }
          } catch (err) {
            console.error(err);
            setAiError(err.message || 'Error al procesar la imagen con la IA.');
            setStep('results');
          }
        } else {
          setStep('results');
        }

        const sc = calcScore();
        setScore(sc);
        setTimeout(() => setRingOffset(283 - (283 * sc / 100)), 100);
        setTimeout(() => {
          resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 200);
      };

      const reset = () => {
        setStep('form'); setScore(0); setRingOffset(283);
        const emptyForm = { nombre: '', edad: '', tipo: '', ascensor: '', anchoAscensor: '', largoAscensor: '', tipoBanyo: '', iluminacion: '', puertas: '', movilidad: '', nivelMovilidad: '', destrezaManos: '', caidas: '', percepcionSeguridad: '', convivencia: '', limitacionPrincipal: '', notas: '' };
        setForm(emptyForm);
        localStorage.removeItem('iadapta_draft');
        setFile(null); setPreview(null); setBase64(null); setAiResponse(''); setAiError('');
      };

      const scoreColor = score >= 75 ? '#22c55e' : score >= 45 ? '#f59e0b' : '#ef4444';
      const scoreLabel = score >= 75 ? 'Buena accesibilidad' : score >= 45 ? 'Accesibilidad mejorable' : 'Accesibilidad limitada';

      const fieldClass = "w-full border-2 border-brand-200 rounded-xl px-4 py-3 text-lg text-gray-800 bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200 transition-all appearance-none";
      const labelClass = "block text-base font-bold text-brand-800 mb-2";

      if (isTeaser) {
        return (
          <section id="analyzer" className="py-24 px-4 bg-gradient-to-b from-sky-50 to-white">
            <div className="max-w-4xl mx-auto">
              <div className="text-center mb-14">
                <span className="inline-block bg-sky-100 text-sky-700 rounded-full px-5 py-2 text-base font-bold uppercase tracking-widest mb-4">Inteligencia Artificial</span>
                <h2 className="font-display text-4xl sm:text-5xl font-bold text-brand-900 mb-4">Analizador de Accesibilidad</h2>
                <div className="section-divider w-24 mx-auto mb-6"></div>
                <p className="text-xl text-gray-600 max-w-2xl mx-auto mb-10">
                  Sube una foto de una estancia o responde a nuestro cuestionario para identificar barreras arquitectónicas en tu hogar.
                </p>

                <div 
                  onClick={() => {
                    const baseUrl = window.location.href.split('?')[0];
                    window.open(`${baseUrl}?page=analyzer`, '_blank');
                  }}
                  className="rounded-3xl overflow-hidden shadow-2xl border border-brand-100 max-w-3xl mx-auto mb-10 relative group cursor-pointer"
                >
                  <img src="assets/ai_analyzer.jpg" alt="Analizador de Accesibilidad" className="w-full h-auto object-cover group-hover:scale-105 transition-transform duration-700" />
                  <div className="absolute inset-0 bg-brand-900/10 group-hover:bg-transparent transition-colors flex items-center justify-center">
                    <div className="bg-white/90 p-4 rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-opacity transform scale-90 group-hover:scale-100">
                      <Icons.Brain />
                    </div>
                  </div>
                </div>

                <button
                  onClick={() => {
                    const baseUrl = window.location.href.split('?')[0];
                    window.open(`${baseUrl}?page=analyzer`, '_blank');
                  }}
                  className="px-10 py-5 bg-sky-600 text-white rounded-2xl font-bold text-xl hover:bg-sky-700 transition-all shadow-xl hover:shadow-2xl btn-pulse flex items-center gap-3 mx-auto"
                >
                  <Icons.Brain />
                  Abrir Analizador IA
                </button>
              </div>
            </div>
          </section>
        );
      }

      return (
        <section id="analyzer-full" className={`py-24 px-4 ${isStandalone ? 'pt-32' : ''} bg-gradient-to-b from-sky-50 to-white min-h-screen`}>
          <div className="max-w-4xl mx-auto">
            <div className="text-center mb-14">
              {isStandalone && (
                <button
                  onClick={() => window.close()}
                  className="mb-8 inline-flex items-center gap-2 text-sky-600 font-bold hover:text-sky-800 transition-colors"
                >
                  <svg className="w-5 h-5 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" /></svg>
                  Cerrar ventana
                </button>
              )}
              <span className="inline-block bg-sky-100 text-sky-700 rounded-full px-5 py-2 text-base font-bold uppercase tracking-widest mb-4">Inteligencia Artificial</span>
              <h2 className="font-display text-4xl sm:text-5xl font-bold text-brand-900 mb-4">Analizador de Accesibilidad</h2>
              <div className="section-divider w-24 mx-auto mb-6"></div>
              <p className="text-xl text-gray-600 max-w-2xl mx-auto mb-10">
                Envía una foto de tu hogar y nuestro sistema identificará qué barreras debes eliminar.
              </p>
              
              {savedReports.length > 0 && step === 'form' && (
                <div className="mb-10 p-6 bg-white border-2 border-indigo-100 rounded-3xl shadow-sm text-left">
                  <h3 className="text-xl font-bold text-indigo-900 mb-4 flex items-center gap-2">
                    <Icons.History /> Mis Informes Guardados
                  </h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {savedReports.map(report => (
                      <div key={report.id} onClick={() => loadFromHistory(report)} className="p-4 bg-indigo-50 hover:bg-indigo-100 border border-indigo-100 rounded-2xl cursor-pointer transition-all group">

                          <span className="text-sm font-bold text-indigo-800">{report.date}</span>

                        </div>

                  </div>
                  <button onClick={() => { localStorage.removeItem('iadapta_reports'); setSavedReports([]); }} className="mt-4 text-xs text-red-500 hover:text-red-700 underline">Borrar todo el historial</button>
                </div>

            </div>

            {step === 'form' && (
              <div className="anim-fade-up">

                <form onSubmit={handleAnalyze} className="bg-white rounded-3xl border border-brand-100 shadow-xl p-8 md:p-10 anim-scale-in" noValidate>

                {/* DRAG AND DROP ZONE */}
                <div className="mb-10">
                  <h3 className="text-xl font-bold text-brand-900 mb-4 flex items-center gap-2">
                    <Icons.Brain /> Análisis Visual (API Gemini)
                  </h3>

                  {!file ? (
                    <div
                      className={`border-3 border-dashed rounded-2xl p-10 text-center transition-all ${isDragging ? 'border-brand-500 bg-brand-50' : 'border-gray-300 hover:border-brand-400 bg-gray-50'}`}

                      onDragLeave={handleDragLeave}
                      onDrop={handleDrop}
                    >
                      <svg className="w-12 h-12 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                      <p className="text-lg font-semibold text-gray-700 mb-2">Arrastra aquí una foto de tu estancia</p>
                      <p className="text-sm text-gray-500 mb-4">o pulsa para seleccionarla desde tu dispositivo</p>
                      <div className="flex flex-wrap justify-center gap-4">
                        <input type="file" accept="image/*" onChange={handleFileSelect} className="hidden" id="file-upload" />

                        <input type="file" accept="image/*" capture="environment" onChange={handleFileSelect} className="hidden" id="camera-upload" />

                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                          Hacer Foto
                        </label>
                      </div>
                    </div>
                  ) : (
                    <div className="relative border border-brand-200 rounded-2xl p-4 bg-brand-50 flex flex-col items-center">
                      <img src={preview} alt="Vista previa" className="max-h-64 rounded-xl shadow-md mb-4 object-contain" />

                    </div>

                      name="nombre" 
                      value={form.nombre} 
                      onChange={handleChange} 
                      placeholder="Ej: María García"
                      className={fieldClass} 
                      required 
                    />
                  </div>
                  <div className="sm:col-span-1">
                    <label className={labelClass}>Edad</label>
                    <input 
                      type="number" 
                      name="edad" 
                      value={form.edad}

                  <div>
                    <label className={labelClass}>Tipo de vivienda</label>
                    <select name="tipo" value={form.tipo} onChange={handleChange} className={fieldClass} required>

                      <option value="piso">Piso</option>
                      <option value="casa">Casa</option>
                    </select>
                  </div>
                  <div>
                    <label className={labelClass}>¿Dispone de ascensor?</label>
                    <select name="ascensor" value={form.ascensor} onChange={handleChange} className={fieldClass}>

                      <option value="si">Sí</option>
                      <option value="no">No</option>
                      <option value="no-precisa">No precisa (p. baja)</option>
                    </select>
                  </div>

                  {form.ascensor === 'si' && (
                    <>
                      <div className="anim-fade-in">
                        <label className={labelClass}>Ancho de puerta del ascensor</label>
                        <select name="anchoAscensor" value={form.anchoAscensor} onChange={handleChange} className={fieldClass}>

                          <option value="estrecha">&lt; 60 cm (Estrecha)</option>
                          <option value="estandar">60-70 cm (Estándar)</option>
                          <option value="ancha">&gt; 70 cm (Ancha)</option>
                        </select>
                      </div>
                      <div className="anim-fade-in">
                        <label className={labelClass}>Largo del interior del ascensor</label>
                        <select name="largoAscensor" value={form.largoAscensor} onChange={handleChange} className={fieldClass}>
                          <option value="">— Selecciona —</option>
                          <option value="estrecho">&lt; 80 cm (Estrecho)</option>
                          <option value="medio">80-95 cm</option>
                          <option value="grande">&gt; 95 cm</option>
                        </select>
                      </div>
                    </>
                  )}

                  <div>
                    <label className={labelClass}>¿Tiene bañera o ducha?</label>
                    <select name="tipoBanyo" value={form.tipoBanyo} onChange={handleChange} className={fieldClass} required>
                      <option value="">— Selecciona —</option>
                      <option value="banera">Bañera</option>
                      <option value="ducha">Ducha</option>
                    </select>
                  </div>
