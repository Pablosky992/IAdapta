name: Send Daily Reminders

on:
  schedule:
    # Runs at 17:00 UTC every day (which is 18:00 CET in Spain winter / 19:00 CEST summer)
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab in GitHub

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install firebase web-push

      - name: Run reminder script
        run: node scripts/send_reminders.js
